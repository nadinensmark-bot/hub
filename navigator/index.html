// Poradce (admin) i druhý krok Konzultanta
function renderPoradceJadro(el, kb){
  const rezim = aiRezim();
  if(!rezim){
    renderLite(el, kb);
    if(window.DH_AI_RUNTIME){
      el.insertAdjacentHTML("beforeend",
        `<div style="margin-top:4px"><span class="chip" onclick="state.porAI=true;save();go(state.view)">${esc(t("porPrepnoutAI"))}</span></div>`);
    }
    el.insertAdjacentHTML("beforeend", `<div class="card" style="border-style:dashed;color:var(--muted);font-size:12.5px;line-height:1.55;margin-top:10px">${esc(t("liteAnalyza"))}</div>`);
    if(state.admin) el.insertAdjacentHTML("beforeend", `<div class="card" style="background:#FDF3DC;border-color:#EAD9A8;color:#9A7B1E;font-size:12.5px;line-height:1.55">${esc(t("porSetup"))}</div>`);
    return;
  }

  if(!state.porTab) state.porTab = "chat";
  el.insertAdjacentHTML("beforeend",
    `<div style="display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap;align-items:center">
       <div class="subtab ${state.porTab==="chat"?"active":""}" onclick="state.porTab='chat';save();go(state.view)">${esc(t("porTabChat"))}</div>
       <div class="subtab ${state.porTab==="analyza"?"active":""}" onclick="state.porTab='analyza';save();go(state.view)">${esc(t("porTabAnalyza"))}</div>
       ${rezim==="demo"?`<span class="chip" onclick="state.porAI=false;save();go(state.view)">${esc(t("porPrepnoutLite"))}</span>`:""}
     </div>`);
  if(rezim==="demo"){
    el.insertAdjacentHTML("beforeend", `<div class="card" style="background:var(--blueSoft);border-color:#C9D8F2;font-size:12.5px;line-height:1.55">${
      state.lang==="en"
        ? "🧪 <strong>Demo mode:</strong> answers run on the Claude account of whoever is viewing this page (their own usage, with a one-time consent prompt). The production version will run on the Defence Hub server."
        : "🧪 <strong>Demo režim:</strong> odpovědi běží na Claude účtu toho, kdo se na stránku dívá (čerpá jeho vlastní využití; poprvé se zobrazí dotaz na souhlas). Ostrá verze poběží na serveru Defence Hubu."
    }</div>`);
  }
  if(state.porTab==="chat") renderChat(el); else renderAnalyza(el);
  el.insertAdjacentHTML("beforeend", `<div style="font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5">⚠ ${esc(t("porDisclaimer"))}</div>`);
}

function renderChat(el){
  if(!state.chatHist) state.chatHist = []; // {role, content}
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div id="chatOkno" class="cscroll" style="max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:6px"></div>
    <div style="display:flex;gap:9px;margin-top:10px">
      <input type="text" id="chatVstup" placeholder="${esc(t("porPlaceholder"))}" style="flex:1" maxlength="2000">
      <button class="btn" id="chatOdeslat">${esc(t("porOdeslat"))}</button>
    </div>
    ${state.chatHist.length?`<button class="btn ghost" style="margin-top:8px;padding:6px 12px;font-size:11.5px" onclick="state.chatHist=[];save();go('poradce')">${esc(t("porNovy"))}</button>`:""}`;
  el.appendChild(card);

  const okno = card.querySelector("#chatOkno");
  function vykresli(){
    okno.innerHTML = state.chatHist.map(z =>
      z.role === "user"
        ? `<div style="align-self:flex-end;max-width:85%;background:var(--blue);color:#fff;border-radius:13px 13px 3px 13px;padding:9px 13px;font-size:13.5px;line-height:1.5;white-space:pre-wrap">${esc(z.content)}</div>`
        : `<div style="align-self:flex-start;max-width:85%;background:var(--mist);border-radius:13px 13px 13px 3px;padding:9px 13px;font-size:13.5px;line-height:1.5">${mdHtml(z.content)}</div>`
    ).join("");
    okno.scrollTop = okno.scrollHeight;
  }
  vykresli();

  const vstup = card.querySelector("#chatVstup");
  const tlacitko = card.querySelector("#chatOdeslat");
  async function odesli(){
    const text = vstup.value.trim();
    if(!text || tlacitko.disabled) return;
    vstup.value = "";
    state.chatHist.push({ role: "user", content: text });
    if(state.chatHist.length > 20) state.chatHist = state.chatHist.slice(-20);
    save(); vykresli();
    tlacitko.disabled = true;
    okno.insertAdjacentHTML("beforeend", `<div id="chatCekam" style="align-self:flex-start;color:var(--muted);font-size:12.5px;padding:4px 2px">${esc(t("porMysli"))}</div>`);
    okno.scrollTop = okno.scrollHeight;
    try {
      const data = await poradceDotaz("/api/chat", { messages: state.chatHist, lang: state.lang, profil: profilText() });
      state.chatHist.push({ role: "assistant", content: data.odpoved || "…" });
    } catch(e) {
      state.chatHist.push({ role: "assistant", content: "⚠ " + (e.message || t("porChyba")) });
    }
    save();
    tlacitko.disabled = false;
    const cekam = document.getElementById("chatCekam"); if(cekam) cekam.remove();
    vykresli();
    vstup.focus();
  }
  tlacitko.onclick = odesli;
  vstup.addEventListener("keydown", e => { if(e.key === "Enter") odesli(); });
}

function renderAnalyza(el){
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div style="color:var(--muted);font-size:12.5px;line-height:1.55;margin-bottom:10px">${esc(t("porAnalyzaSub"))}</div>
    <textarea id="specVstup" rows="9" placeholder="${esc(t("porAnalyzaPlaceholder"))}"></textarea>
    <div style="margin-top:10px"><button class="btn" id="specOdeslat">${esc(t("porAnalyzaBtn"))}</button></div>
    <div id="specStav" style="margin-top:10px;font-size:12.5px;color:var(--muted)"></div>
    <div id="specVysledek" style="margin-top:6px;font-size:13.5px;line-height:1.55"></div>`;
  el.appendChild(card);

  const tlacitko = card.querySelector("#specOdeslat");
  tlacitko.onclick = async () => {
    const spec = card.querySelector("#specVstup").value.trim();
    const stav = card.querySelector("#specStav");
    const vysledek = card.querySelector("#specVysledek");
    if(spec.length < 100){ stav.textContent = t("porAnalyzaPlaceholder"); return; }
    tlacitko.disabled = true;
    stav.textContent = t("porAnalyzaMysli");
    vysledek.innerHTML = "";
    try {
      const data = await poradceDotaz("/api/analyza", { specifikace: spec, lang: state.lang });
      stav.textContent = "";
      vysledek.innerHTML = `<div style="background:var(--mist);border-radius:12px;padding:14px 16px">${mdHtml(data.odpoved || "")}</div>`;
    } catch(e) {
      stav.textContent = "⚠ " + (e.message || t("porChyba"));
    }
    tlacitko.disabled = false;
  };
}

// =====================================================================
// 5) KNOWLEDGE BASE (správa obsahu)
// =====================================================================
function vKB(el){
  const kb = KB();
  header(el, t("kbKicker"), t("kbTitle"), t("kbSub"));

  const overitPocet = kb.programy.filter(p=>p.overit||p.terminyOverit).length;
  const soubor = state.lang==="en" ? "kb-en.js" : "kb.js";
  const jazyk = state.lang==="en" ? "EN" : "CZ";

  el.insertAdjacentHTML("beforeend", `
    <div class="card">
      <div class="kicker" style="margin-bottom:6px">${esc(t("kbStav"))}</div>
      <div style="font-size:13px">${esc(t("kbPocty",{p:kb.programy.length,v:(kb.vyzvy||[]).length,d:kb.dualUse.domeny.length,ver:kb.meta.verze,akt:kb.meta.aktualizovano}))}</div>
      ${overitPocet?`<div style="margin-top:8px;font-size:12.5px;color:#9A7B1E;background:#FDF3DC;border-radius:8px;padding:8px 12px">${t("kbOverit",{n:overitPocet})}</div>`:""}
      ${state["kbOverride_"+state.lang]?`<div style="margin-top:8px;font-size:12.5px;color:var(--blue);background:var(--blueSoft);border-radius:8px;padding:8px 12px">${esc(t("kbOverride",{l:jazyk}))} <a href="#" onclick="delete state['kbOverride_'+state.lang];save();go('kb');return false">${esc(t("kbVratit"))} ${esc(soubor)}</a></div>`:""}
    </div>
    <div class="card">
      <div class="kicker" style="margin-bottom:10px">${esc(t("kbEditor",{l:jazyk}))}</div>
      <textarea id="kbEditor" rows="18" class="mono cscroll" style="font-size:11.5px;white-space:pre" spellcheck="false">${esc(JSON.stringify(kb, null, 2))}</textarea>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
        <button class="btn" onclick="ulozKB()">${esc(t("kbUlozit"))}</button>
        <button class="btn ghost" onclick="exportKB()">${esc(t("kbExport",{f:soubor}))}</button>
      </div>
      <div id="kbMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>`);
}
function ulozKB(){
  const txt = document.getElementById("kbEditor").value;
  const msg = document.getElementById("kbMsg");
  try{ JSON.parse(txt); state["kbOverride_"+state.lang] = txt; save(); msg.style.color="var(--green)"; msg.textContent=t("kbUlozeno"); applyChrome(); }
  catch(e){ msg.style.color="var(--clay)"; msg.textContent=t("kbChyba")+e.message; }
}
function exportKB(){
  const txt = document.getElementById("kbEditor").value;
  const varName = state.lang==="en" ? "DH_KB_EN" : "DH_KB";
  const fname = state.lang==="en" ? "kb-en.js" : "kb.js";
  try{
    const obj = JSON.parse(txt);
    const src = "// DH Kompas – knowledge base ("+state.lang+", export "+new Date().toISOString().slice(0,10)+")\nwindow."+varName+" = " + JSON.stringify(obj, null, 2) + ";\n";
    const blob = new Blob([src], {type:"text/javascript"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = fname; a.click();
    URL.revokeObjectURL(a.href);
  }catch(e){
    const msg = document.getElementById("kbMsg");
    msg.style.color="var(--clay)"; msg.textContent=t("kbChyba")+e.message;
  }
}

// ---------------- start ----------------
// Admin režim: záložka Knowledge base je pro tým DH, ne pro startupy.
// Zapíná se otevřením adresy s #admin, vypíná s #noadmin. Je to jen
// skrytí v menu (obsah KB je stejně veřejný v kb.js) – skutečná správa
// obsahu se dělá v repozitáři.
function aplikujAdmin(){
  if(location.hash === "#admin"){ state.admin = true; save(); }
  if(location.hash === "#noadmin"){ state.admin = false; save(); }
  document.getElementById("navKb").style.display = state.admin ? "" : "none";
  // Samostatná záložka Poradce je jen pro admin režim – veřejnost má
  // plnohodnotný chat jako druhý krok Konzultanta (méně matoucí)
  document.getElementById("navPoradce").style.display = state.admin ? "" : "none";
  document.getElementById("porBadge").textContent = aiRezim() ? "AI" : "BETA";
  if(!state.admin && state.view === "kb"){ state.view = "wizard"; save(); go("wizard"); }
}
window.addEventListener("hashchange", aplikujAdmin);
aplikujAdmin();
if(!state.admin && state.view === "kb") state.view = "wizard";
applyChrome();
zkontrolujBackend();
go(state.view && views[state.view] ? state.view : "wizard", state.viewParam);
</script>
