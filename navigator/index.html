<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DH Kompas – průvodce EU programy pro defence & dual-use startupy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="kb.js"></script>

<style>
:root{
  --ink:#0B1530; --navy:#13234E; --navy2:#1C2F63; --blue:#2B5CC4; --blueSoft:#E8EEFA;
  --steel:#3E7CA8; --green:#6E9152; --greenSoft:#ECF1E5; --clay:#BD6B4B; --claySoft:#F7ECE6;
  --paper:#FBFBFC; --mist:#F3F5F9; --line:#E2E7F0; --muted:#5C6886;
}
*{box-sizing:border-box}
::selection{background:var(--blue);color:#fff}
html,body{margin:0;padding:0;height:100%}
body{background:var(--mist);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;color:var(--navy);font-size:14px}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
a{color:var(--blue)}
.mono{font-family:'IBM Plex Mono',monospace}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
@keyframes cfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:cfade .35s ease both}
.cscroll::-webkit-scrollbar{width:8px;height:8px}
.cscroll::-webkit-scrollbar-thumb{background:#d3dae8;border-radius:8px}
.cscroll::-webkit-scrollbar-track{background:transparent}

.layout{display:flex;height:100vh;overflow:hidden}
aside{flex:none;width:252px;background:radial-gradient(120% 90% at 20% 0%,#1B2D5E 0%,#0E1B3C 60%,#0B1530 100%);display:flex;flex-direction:column;padding:22px 16px 16px;color:#fff}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:500;color:#C7D0E6}
.navitem:hover{background:rgba(255,255,255,.06)}
.navitem.active{background:rgba(43,92,196,.35);color:#fff}
.navitem svg{flex:none}
.langbtn{flex:1;text-align:center;padding:5px 0;border-radius:8px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.08em;color:#7E8FB8}
.langbtn.active{background:rgba(43,92,196,.4);color:#fff}
main{flex:1;overflow-y:auto;padding:34px 40px 60px}
.wrap{max-width:880px;margin:0 auto}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;border:none;border-radius:11px;padding:11px 20px;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer}
.btn:hover{background:#2450AC}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--blueSoft)}
.btn:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;font-weight:600}
.tag.grant{background:var(--greenSoft);color:var(--green)}
.tag.equity{background:var(--claySoft);color:var(--clay)}
.tag.akcelerator{background:var(--blueSoft);color:var(--blue)}
.tag.mix{background:#EFEAF7;color:#6B4BAA}
.tag.pujcky{background:var(--mist);color:var(--muted)}
.tag.overit{background:#FDF3DC;color:#9A7B1E}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:9px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--navy)}
.opt:hover{border-color:var(--blue);background:var(--blueSoft)}
.opt.sel{border-color:var(--blue);background:var(--blueSoft);box-shadow:0 0 0 1px var(--blue) inset}
.opt small{display:block;color:var(--muted);margin-top:3px;font-size:12px}
.chip{display:inline-block;border:1.5px solid var(--line);border-radius:20px;padding:7px 14px;margin:0 7px 8px 0;cursor:pointer;font-size:12.5px;background:var(--paper)}
.chip:hover{border-color:var(--blue)}
.chip.sel{border-color:var(--blue);background:var(--blueSoft);font-weight:600}
.ynrow{display:flex;gap:8px}
.ynrow .opt{flex:1;text-align:center;margin:0;padding:9px 8px;font-size:13px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--blue);border-radius:6px;transition:width .3s}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:none}
.check input{margin-top:2px;accent-color:var(--green)}
.check.done span{color:var(--muted);text-decoration:line-through}
textarea,select,input[type=text]{width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px}
textarea:focus,select:focus,input:focus{outline:none;border-color:var(--blue)}
table.zmeny{width:100%;border-collapse:collapse;font-size:13px}
table.zmeny th{text-align:left;padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
table.zmeny td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.scorebar{flex:none;width:110px;height:7px;background:var(--line);border-radius:6px;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--mist);border-radius:8px;padding:4px 10px;margin:2px 4px 2px 0}
.subtab{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);border:1.5px solid var(--line);background:var(--paper)}
.subtab.active{color:#fff;background:var(--blue);border-color:var(--blue)}
.tablewrap{overflow-x:auto}
@media(max-width:760px){
  .layout{flex-direction:column}
  aside{width:100%;flex-direction:row;align-items:center;padding:12px 14px;overflow-x:auto}
  aside nav{flex-direction:row!important}
  main{padding:20px 16px 50px}
  .hidemobile{display:none!important}
}
</style>
</head>

function t(key, vars){
  let s = UI[state.lang][key];
  if(s === undefined) s = UI.cs[key];
  if(typeof s === "string" && vars) for(const k in vars) s = s.split("{"+k+"}").join(vars[k]);
  return s;
}

// KB podle jazyka; lokální úpravy (záložka Knowledge base) mají přednost
function KB(){
  const ov = state["kbOverride_"+state.lang];
  if(ov){ try{ return JSON.parse(ov); }catch(e){} }
  return state.lang==="en" ? window.DH_KB_EN : window.DH_KB;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const views = { wizard: vWizard, programy: vProgramy, vyzvy: vVyzvy, prihlaska: vPrihlaska, dualuse: vDualUse, kb: vKB, program: vProgramDetail };
function go(view, param){
  state.view = view; state.viewParam = param; save();
  document.querySelectorAll(".navitem").forEach(n=>n.classList.toggle("active", n.dataset.view===view || (view==="program" && n.dataset.view==="programy")));
  const el = document.getElementById("app");
  el.innerHTML = ""; el.className = "wrap fade";
  (views[view]||vWizard)(el, param);
  document.querySelector("main").scrollTop = 0;
  void el.offsetWidth;
}
function header(el, kicker, title, sub){
  el.insertAdjacentHTML("beforeend",
    `<div style="margin-bottom:22px">
       <div class="kicker">${esc(kicker)}</div>
       <h1 style="font-size:26px;margin:6px 0 4px">${esc(title)}</h1>
       ${sub?`<div style="color:var(--muted);font-size:14px;max-width:640px;line-height:1.5">${esc(sub)}</div>`:""}

}

// ---------------- výzvy: výpočet stavu z dat v KB ----------------
function fmtDatum(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return state.lang==="en"
    ? d.toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"})
    : d.getDate()+". "+(d.getMonth()+1)+". "+d.getFullYear();
}
function stavVyzvy(v){
  // Vrací {rank, text, barva, bg}; rank řídí řazení (nejnaléhavější první)
  if(v.stavRucne)
    return { rank:1.5, text:v.stavRucne, barva:"var(--steel)", bg:"var(--blueSoft)" };
  const od = Date.parse(v.otevreniOd), uz = Date.parse(v.uzaverka);
  const dnes = Date.now();
  if(!isNaN(od) && od > dnes)
    return { rank:2, text:t("stPlan",{d:fmtDatum(v.otevreniOd)}), barva:"var(--steel)", bg:"var(--blueSoft)" };
  if(isNaN(uz))
    return { rank:3, text:t("stNezn"), barva:"#9A7B1E", bg:"#FDF3DC" };
  const dny = Math.ceil((uz - dnes) / 86400000);
  if(dny < 0)  return { rank:4, text:t("stPo",{d:fmtDatum(v.uzaverka)}), barva:"var(--muted)", bg:"var(--mist)" };
  if(dny <= 30) return { rank:0, text:t("stBrzy",{n:dny,d:fmtDatum(v.uzaverka)}), barva:"var(--clay)", bg:"var(--claySoft)" };
  return { rank:1, text:t("stOtevrena",{d:fmtDatum(v.uzaverka)}), barva:"var(--green)", bg:"var(--greenSoft)" };
}
function aktivniVyzvy(kb, programId){
  return (kb.vyzvy||[])
    .filter(v=>!programId || v.program===programId)
    .map(v=>({v, s:stavVyzvy(v)}))
    .sort((a,b)=>a.s.rank-b.s.rank);
}
function stariKB(kb){
  const d = Date.parse(kb.meta.aktualizovano);
  return isNaN(d) ? null : Math.floor((Date.now()-d)/86400000);
}

function vWizard(el){
  const kb = KB();
  const otazky = kb.wizard;
  if(!state.odpovedi) state.odpovedi = {};
  const zodpovezeno = otazky.filter(o=>state.odpovedi[o.id]).length;
  const hotovo = zodpovezeno === otazky.length;

  header(el, t("wizKicker"), t("wizTitle"), t("wizSub",{n:otazky.length}));

  // aktuální krok: uložený, jinak první nezodpovězená otázka
  let krok = state.wizKrok;
  if(typeof krok !== "number"){
    const prvni = otazky.findIndex(q=>!state.odpovedi[q.id]);
    krok = prvni === -1 ? otazky.length : prvni;
  }
  krok = Math.max(0, Math.min(krok, otazky.length));
  if(krok >= otazky.length && !hotovo){
    krok = otazky.findIndex(q=>!state.odpovedi[q.id]);
  }

  el.insertAdjacentHTML("beforeend",
    `<div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
       <div class="bar" style="flex:1"><div style="width:${(zodpovezeno/otazky.length)*100}%"></div></div>
       <div class="mono" style="font-size:11px;color:var(--muted)">${zodpovezeno}/${otazky.length}</div>
       ${zodpovezeno?`<button class="btn ghost" style="padding:7px 14px;font-size:12px" onclick="state.odpovedi={};state.wizKrok=0;save();go('wizard')">${esc(t("znovu"))}</button>`:""}
     </div>`);

  if(krok < otazky.length){
    // jedna otázka na obrazovce; zodpovězené mizí, zpět se dá vracet
    const o = otazky[krok];
    const odp = state.odpovedi[o.id];
    const div = document.createElement("div");
    div.className = "card fade";
    div.innerHTML = `<div class="kicker" style="margin-bottom:4px">${esc(t("otazka",{n:krok+1}))} / ${otazky.length}</div>
      <h3 style="font-size:16px;margin:0 0 ${o.napoveda?"4":"12"}px">${esc(o.otazka)}</h3>
      ${o.napoveda?`<div style="color:var(--muted);font-size:12.5px;margin-bottom:12px">${esc(o.napoveda)}</div>`:""}`;
    o.moznosti.forEach(m=>{
      const b = document.createElement("button");
      b.className = "opt" + (odp===m.v ? " sel":"");
      b.innerHTML = `<strong>${esc(m.t)}</strong>${m.p?`<small>${esc(m.p)}</small>`:""}`;
      b.onclick = ()=>{ state.odpovedi[o.id]=m.v; state.wizKrok=krok+1; save(); go("wizard"); };
      div.appendChild(b);
    });
    if(krok > 0){
      const back = document.createElement("button");
      back.className = "btn ghost";
      back.style.cssText = "margin-top:6px;padding:8px 16px;font-size:12.5px";
      back.textContent = t("wizZpet");
      back.onclick = ()=>{ state.wizKrok = krok-1; save(); go("wizard"); };
      div.appendChild(back);
    }
    el.appendChild(div);
    return;
  }

  // všechny otázky zodpovězené → jen výsledky
  el.insertAdjacentHTML("beforeend",
    `<div style="margin-bottom:14px"><button class="btn ghost" style="padding:8px 16px;font-size:12.5px" onclick="state.wizKrok=${otazky.length-1};save();go('wizard')">${esc(t("wizUpravit"))}</button></div>`);
  renderVysledky(el, kb);
}

function skoreProgramu(p, o){
  // Vrací {skore 0-100, plusy[], minusy[]}
  const plusy=[], minusy=[]; let s=0, max=0;

  max+=3; // zaměření
  if(o.zamereni==="nevim"){ s+=2; }
  else if(p.zamereni===o.zamereni){ s+=3; plusy.push(t("sZamereniOk",{z:t("zamereni")[p.zamereni]})); }
  else if(p.zamereni==="dual"){ s+=2; plusy.push(t("sDualOk")); }
  else { minusy.push(t("sZamereniNe",{z:t("zamereniJine")[p.zamereni]})); }

  max+=3; // TRL
  const [omin,omax] = o.trl.split("-").map(Number);
  if(omax >= p.trl[0] && omin <= p.trl[1]){ s+=3; plusy.push(t("sTrlOk",{a:o.trl,b:p.trl[0]+"–"+p.trl[1]})); }
  else minusy.push(t("sTrlNe",{a:o.trl,b:p.trl[0]+"–"+p.trl[1]}));

  max+=2; // typ podpory
  if(o.typ==="vse"){ s+=2; }
  else if(p.typ===o.typ || p.typ==="mix"){ s+=2; plusy.push(t("sTypOk")); }
  else minusy.push(t("sTypNe",{a:t("typNabizi")[p.typ],b:t("typHledam")[o.typ]}));

  max+=2; // konsorcium
  if(p.konsorcium && o.konsorcium==="ne"){ minusy.push(t("sKonsNe")); }
  else { s+=2; plusy.push(p.konsorcium ? t("sKonsOk1") : t("sKonsOk2")); }

  max+=1; // velikost
  if(p.velikost.includes(o.velikost)){ s+=1; }
  else minusy.push(t("sVelNe"));

  return { skore: Math.round((s/max)*100), plusy, minusy };
}

      ${v.plusy.slice(0,3).map(x=>`<div style="display:flex;gap:8px;font-size:12.5px;padding:2px 0"><span style="color:var(--green)">✓</span><span>${esc(x)}</span></div>`).join("")}
      ${v.minusy.slice(0,2).map(x=>`<div style="display:flex;gap:8px;font-size:12.5px;padding:2px 0"><span style="color:var(--clay)">✕</span><span style="color:var(--muted)">${esc(x)}</span></div>`).join("")}
      <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn ghost" style="padding:8px 14px;font-size:12.5px" onclick="go('program','${esc(v.p.id)}')">${esc(t("detailBtn"))}</button>

    div.appendChild(card);
  });
  div.insertAdjacentHTML("beforeend",

       <strong>${esc(t("dalsiKrok"))}</strong> ${esc(t("dalsiKrokText"))} ${esc(kb.meta.kontakt)}

        <div class="kicker" style="margin-bottom:8px;color:var(--clay)">${esc(t("nehodiSe"))}</div>

    <div class="card" style="margin-top:14px;background:var(--blueSoft);border-color:#C9D8F2">
      <div class="kicker" style="margin-bottom:6px;color:var(--blue)">${esc(t("pomocDH"))}</div>
      <div style="line-height:1.55">${esc(p.pomocDH)}</div>
      <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn" style="text-decoration:none" href="${esc(p.odkaz)}" target="_blank" rel="noopener">${esc(t("oficialni"))}</a>

// =====================================================================
// 2b) AKTUÁLNÍ VÝZVY
// =====================================================================
function vVyzvy(el){
  const kb = KB();
  header(el, t("vyzKicker"), t("vyzTitle"), t("vyzSub"));

  const stari = stariKB(kb);
  if(stari !== null && stari > 60){
    el.insertAdjacentHTML("beforeend",
      `<div class="card" style="background:#FDF3DC;border-color:#EAD9A8;color:#9A7B1E">${esc(t("vyzStale",{n:stari,d:fmtDatum(kb.meta.aktualizovano)}))}</div>`);
  }

  const seznam = aktivniVyzvy(kb);
  if(!seznam.length){
    el.insertAdjacentHTML("beforeend", `<div class="card" style="color:var(--muted)">${esc(t("vyzEmpty"))}</div>`);
    return;
  }
  seznam.forEach(({v,s})=>{
    const p = kb.programy.find(x=>x.id===v.program);
    el.insertAdjacentHTML("beforeend",
      `<div class="card" style="${s.rank===4?"opacity:.55;":""}">
         <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
           <h3 style="font-size:15px;margin:0;flex:1;min-width:200px">${esc(v.nazev)}${v.priklad?` <span class="tag overit">${esc(t("ukazka"))}</span>`:""}</h3>
           <span class="tag" style="background:${s.bg};color:${s.barva}">${esc(s.text)}</span>
         </div>
         <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)">
           ${p?`<a href="#" onclick="go('program','${esc(p.id)}');return false">${esc(p.nazev)}</a>`:""}
           ${v.pozn?`<span>${esc(v.pozn)}</span>`:""}
           <a href="${esc(v.odkaz)}" target="_blank" rel="noopener">${esc(t("vyzZdroj"))}</a>
         </div>
       </div>`);
  });

  el.insertAdjacentHTML("beforeend",
    `<div class="card" style="border-style:dashed;color:var(--muted);font-size:12.5px;line-height:1.55">${t("vyzJak")}</div>`);
}

// =====================================================================
// 3) PRŮVODCE PŘIHLÁŠKOU
// =====================================================================
function vPrihlaska(el){
  const kb = KB();
  header(el, t("priKicker"), t("priTitle"), t("priSub"));

  const sel = state.prihlaskaProgram || "";
  el.insertAdjacentHTML("beforeend",
    `<div class="card">
       <div class="kicker" style="margin-bottom:8px">${esc(t("priPro"))}</div>
       <select onchange="state.prihlaskaProgram=this.value;save();go('prihlaska')">
         <option value="">${esc(t("priObecna"))}</option>
         ${kb.programy.map(p=>`<option value="${esc(p.id)}" ${p.id===sel?"selected":""}>${esc(p.nazev)}</option>`).join("")}
       </select>
     </div>`);

  const selProgram = kb.programy.find(p=>p.id===sel);
  if(selProgram && selProgram.kdeKriteria){
    el.insertAdjacentHTML("beforeend",
      `<div class="card" style="background:var(--blueSoft);border-color:#C9D8F2">
         <div class="kicker" style="margin-bottom:6px;color:var(--blue)">${esc(t("kdeKriteriaL"))}</div>
         <div style="line-height:1.55;font-size:13.5px">${esc(selProgram.kdeKriteria)}</div>
       </div>`);
  }

  const kroky = document.createElement("div");
  kroky.className = "card";
  kroky.innerHTML = `<div class="kicker" style="margin-bottom:10px">${esc(t("priZasady"))}</div>`;
  kb.prihlaska.obecneKroky.forEach((k,i)=>{
    kroky.insertAdjacentHTML("beforeend",
      `<div style="display:flex;gap:13px;padding:10px 0;border-bottom:1px solid var(--line)">
         <span class="mono" style="flex:none;width:26px;height:26px;border-radius:50%;background:var(--blueSoft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">${i+1}</span>
         <div><strong style="font-size:13.5px">${esc(k.krok)}</strong><div style="color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5">${esc(k.popis)}</div></div>
       </div>`);
  });
  el.appendChild(kroky);

  const items = kb.prihlaska.checklisty[sel] || kb.prihlaska.checklisty.default;
  const ckey = "chk_" + (sel||"default");
  if(!state[ckey]) state[ckey] = {};
  const chk = document.createElement("div");
  chk.className = "card";
  const doneCount = items.filter((_,i)=>state[ckey][i]).length;
  chk.innerHTML = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
    <div class="kicker" style="flex:1">${esc(t("priChecklist"))}${sel?": "+esc((kb.programy.find(p=>p.id===sel)||{}).nazev||""):" "+esc(t("priObecny"))}</div>
    <span class="mono" style="font-size:11px;color:${doneCount===items.length?"var(--green)":"var(--muted)"}">${doneCount}/${items.length}</span></div>`;
  items.forEach((it,i)=>{
    const done = !!state[ckey][i];
    const row = document.createElement("label");
    row.className = "check"+(done?" done":"");
    row.innerHTML = `<input type="checkbox" ${done?"checked":""}><span style="font-size:13px;line-height:1.5">${esc(it)}</span>`;
    row.querySelector("input").onchange = e=>{ state[ckey][i]=e.target.checked; save(); go("prihlaska"); };
    chk.appendChild(row);
  });
  el.appendChild(chk);

  el.insertAdjacentHTML("beforeend",
    `<div class="card" style="background:var(--blueSoft);border-color:#C9D8F2">${t("priNez",{k:esc(kb.meta.kontakt)})}</div>`);
}

// =====================================================================
// 4) DUAL-USE: TEST + PŘEKLADAČ (fáze 2 – beta)
// =====================================================================
function vDualUse(el){
  const kb = KB();
  if(!state.duTab) state.duTab = "test";
  header(el, t("duKicker"), t("duTitle"), t("duSub"));
  el.insertAdjacentHTML("beforeend",
    `<div style="display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap">
       <div class="subtab ${state.duTab==="test"?"active":""}" onclick="state.duTab='test';save();go('dualuse')">${esc(t("duTabTest"))}</div>
       <div class="subtab ${state.duTab==="preklad"?"active":""}" onclick="state.duTab='preklad';save();go('dualuse')">${esc(t("duTabPreklad"))}</div>
     </div>`);
  if(state.duTab==="test") renderDuTest(el, kb); else renderPrekladac(el, kb);
}

// ---------- 4a) test „jste dual-use?" – podle kontrolních seznamů ----------
function renderDuTest(el, kb){
  const test = kb.dualUseTest;
  if(!test || !test.kategorieAnnex){ el.insertAdjacentHTML("beforeend", `<div class="card" style="color:var(--muted)">[KB: dualUseTest missing]</div>`); return; }
  if(!state.duTest2) state.duTest2 = { odpovedi:{}, kategorie:[], katOdpovedi:{} };
  const s = state.duTest2;
  const a = s.odpovedi;

  el.insertAdjacentHTML("beforeend", `<div class="card" style="color:var(--muted);font-size:12.5px;line-height:1.55">${esc(test.uvod)}</div>`);
  el.insertAdjacentHTML("beforeend", `<div class="card" style="background:var(--blueSoft);border-color:#C9D8F2;font-size:12.5px;line-height:1.55">${t("duSpec")}</div>`);

  function ynRow(container, val, onPick){
    const yn = document.createElement("div");
    yn.className = "ynrow";
    [["ano",t("ano")],["ne",t("ne")],["nevim",t("nevim")]].forEach(([v,lbl])=>{
      const b = document.createElement("button");
      b.className = "opt" + (val===v?" sel":"");
      b.textContent = lbl;
      b.onclick = ()=>{ onPick(v); save(); go("dualuse"); };
      yn.appendChild(b);
    });
    container.appendChild(yn);
  }
  function otazkaRow(card, o){
    const row = document.createElement("div");
    row.style.cssText = "padding:10px 0;border-bottom:1px solid var(--line)";
    row.innerHTML = `<div style="font-size:13.5px;font-weight:600;margin-bottom:${o.napoveda?"3":"8"}px">${esc(o.text)}</div>
      ${o.napoveda?`<div style="color:var(--muted);font-size:12px;margin-bottom:8px">${esc(o.napoveda)}</div>`:""}`;
    ynRow(row, a[o.id], v=>{ a[o.id]=v; });
    card.appendChild(row);
  }

  // 1) vojenský seznam
  const c1 = document.createElement("div");
  c1.className = "card";
  otazkaRow(c1, test.otazky[0]);
  el.appendChild(c1);

  // 2) kategorie přílohy I (multi-select) + parametry vybraných
  const ka = test.kategorieAnnex;
  const c2 = document.createElement("div");
  c2.className = "card";
  c2.innerHTML = `<div style="font-size:13.5px;font-weight:600;margin-bottom:3px">${esc(ka.text)}</div>
    <div style="color:var(--muted);font-size:12px;margin-bottom:10px">${esc(ka.napoveda)}</div>`;
  ka.polozky.forEach(p=>{
    const c = document.createElement("span");
    c.className = "chip" + (s.kategorie.includes(p.kod)?" sel":"");
    c.textContent = p.kod+" · "+p.nazev;
    c.onclick = ()=>{
      s.kategorie = s.kategorie.filter(x=>x!=="zadna");
      if(s.kategorie.includes(p.kod)){ s.kategorie = s.kategorie.filter(x=>x!==p.kod); delete s.katOdpovedi[p.kod]; }
      else s.kategorie.push(p.kod);
      save(); go("dualuse");
    };
    c2.appendChild(c);
  });
  const cz = document.createElement("span");
  cz.className = "chip" + (s.kategorie.includes("zadna")?" sel":"");
  cz.textContent = ka.zadna;
  cz.onclick = ()=>{ s.kategorie = s.kategorie.includes("zadna") ? [] : ["zadna"]; s.katOdpovedi = {}; save(); go("dualuse"); };
  c2.appendChild(cz);

  s.kategorie.filter(k=>k!=="zadna").forEach(kod=>{
    const p = ka.polozky.find(x=>x.kod===kod);
    if(!p) return;
    const box = document.createElement("div");
    box.style.cssText = "margin-top:14px;padding:14px 16px;background:var(--mist);border-radius:12px";
    box.innerHTML = `<div class="kicker" style="margin-bottom:4px">${esc(t("duKategorie",{k:p.kod}))}</div>
      <div style="font-size:13.5px;font-weight:600;margin-bottom:8px">${esc(p.nazev)}</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">${esc(t("duPriklady"))}</div>
      ${p.priklady.map(x=>`<div style="display:flex;gap:8px;font-size:12.5px;padding:2px 0"><span style="color:var(--blue)">›</span><span>${esc(x)}</span></div>`).join("")}
      <div style="font-size:13px;font-weight:600;margin:10px 0 3px">${esc(ka.otazkaParametry)}</div>
      <div style="color:var(--muted);font-size:11.5px;margin-bottom:8px">${esc(ka.napovedaParametry)}</div>`;
    ynRow(box, s.katOdpovedi[kod], v=>{ s.katOdpovedi[kod]=v; });
    c2.appendChild(box);
  });
  el.appendChild(c2);

  // 3) ostatní otázky
  const c3 = document.createElement("div");
  c3.className = "card";
  test.otazky.slice(1).forEach(o=>otazkaRow(c3, o));
  el.appendChild(c3);

  // hotovo?
  const vybrane = s.kategorie.filter(k=>k!=="zadna");
  const katHotovo = s.kategorie.includes("zadna") || (vybrane.length>0 && vybrane.every(k=>s.katOdpovedi[k]));
  const hotovo = test.otazky.every(o=>a[o.id]) && katHotovo;
  if(!hotovo){
    el.insertAdjacentHTML("beforeend", `<div class="card" style="color:var(--muted)">${esc(t("duTestNedokonceno"))}</div>`);
    return;
  }

  // verdikt podle seznamů
  const katAno = vybrane.some(k=>s.katOdpovedi[k]==="ano");
  const katNevim = vybrane.some(k=>s.katOdpovedi[k]==="nevim");
  let vId;
  if(a.vojenske==="ano") vId = "vojensky";
  else if(katAno) vId = "listed";
  else if(a.vojenske==="nevim" || katNevim) vId = "zatrideni";
  else vId = "unlisted";
  const v = test.verdikty[vId];
  const barvy = { vojensky:["var(--clay)","var(--claySoft)","#EBD9CE"], listed:["var(--green)","var(--greenSoft)","#DCE5D0"], zatrideni:["#9A7B1E","#FDF3DC","#EAD9A8"], unlisted:["var(--steel)","var(--blueSoft)","#C9D8F2"] };
  const [bc,bg,bb] = barvy[vId];
  el.insertAdjacentHTML("beforeend",
    `<div class="card" style="background:${bg};border-color:${bb}">
       <div class="kicker" style="margin-bottom:6px;color:${bc}">${esc(t("duVerdikt"))}</div>
       <h2 style="font-size:19px;margin:0 0 8px;color:${bc}">${esc(v.nazev)}</h2>
       <div style="line-height:1.55;font-size:13.5px">${esc(v.text)}</div>
       <button class="btn ghost" style="margin-top:12px;padding:7px 14px;font-size:12px;background:#fff" onclick="state.duTest2={odpovedi:{},kategorie:[],katOdpovedi:{}};save();go('dualuse')">${esc(t("duZnovu"))}</button>
     </div>`);

  // co dál – kroky podle verdiktu
  if(v.dalsiKroky && v.dalsiKroky.length){
    el.insertAdjacentHTML("beforeend",
      `<div class="card">
         <div class="kicker" style="margin-bottom:10px">${esc(test.dalsiKrokyNadpis||"")}</div>
         ${v.dalsiKroky.map((k,i)=>`<div style="display:flex;gap:12px;padding:6px 0;line-height:1.5"><span class="mono" style="flex:none;width:24px;height:24px;border-radius:50%;background:var(--blueSoft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600">${i+1}</span><span style="font-size:13px">${esc(k)}</span></div>`).join("")}
       </div>`);
  }

  // režimy
  const aktivni = (test.rezimy||[]).filter(r=>{
    const pod = r.podminky||{};
    for(const k in pod){
      if(k==="katAno"){ if(!katAno) return false; }
      else if(k==="katNevim"){ if(!katNevim) return false; }
      else if(a[k]!==pod[k]) return false;
    }
    return true;
  });
  const rez = document.createElement("div");
  rez.className = "card";
  rez.innerHTML = `<div class="kicker" style="margin-bottom:10px">${esc(t("duRezimy"))}</div>`;
  if(!aktivni.length) rez.insertAdjacentHTML("beforeend", `<div style="color:var(--muted);font-size:13px">${esc(t("duRezimyEmpty"))}</div>`);
  aktivni.forEach(r=>{
    rez.insertAdjacentHTML("beforeend",
      `<div style="padding:11px 0;border-bottom:1px solid var(--line)">
         <strong style="font-size:13.5px">${esc(r.nazev)}</strong>
         <div style="font-size:12.5px;margin-top:4px;line-height:1.5"><span style="color:var(--muted)">${esc(t("duKdy"))}</span> ${esc(r.kdy)}</div>
         <div style="font-size:12.5px;margin-top:2px;line-height:1.5"><span style="color:var(--muted)">${esc(t("duAkce"))}</span> ${esc(r.akce)}</div>
       </div>`);
  });
  el.appendChild(rez);

  // oficiální zdroje
  if(test.odkazy && test.odkazy.length){
    el.insertAdjacentHTML("beforeend",
      `<div class="card" style="background:var(--blueSoft);border-color:#C9D8F2">
         <div class="kicker" style="margin-bottom:8px;color:var(--blue)">${esc(t("duOdkazy"))}</div>
         ${test.odkazy.map(o=>`<div style="padding:3px 0;font-size:13px"><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.t)} ↗</a></div>`).join("")}
       </div>`);
  }

  el.insertAdjacentHTML("beforeend",
    `<div class="card" style="background:#FDF3DC;border-color:#EAD9A8;color:#9A7B1E;font-size:12.5px;line-height:1.55">⚠ ${esc(test.disclaimer)}</div>`);
}

// ---------- 4b) překladač use casů ----------
function renderPrekladac(el, kb){
  const du = kb.dualUse;
  if(!state.du) state.du = { smer:"d2k", domena:"", popis:"" };
  const s = state.du;

  el.insertAdjacentHTML("beforeend", `
    <div class="card">
      <div class="kicker" style="margin-bottom:10px">${esc(t("duSmer"))}</div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="opt" style="flex:1;min-width:220px;margin:0;${s.smer==='d2k'?'border-color:var(--blue);background:var(--blueSoft)':''}" onclick="state.du.smer='d2k';save();go('dualuse')">
          <strong>${esc(t("duD2K"))}</strong><small>${esc(t("duD2Ksub"))}</small></button>
        <button class="opt" style="flex:1;min-width:220px;margin:0;${s.smer==='k2d'?'border-color:var(--blue);background:var(--blueSoft)':''}" onclick="state.du.smer='k2d';save();go('dualuse')">
          <strong>${esc(t("duK2D"))}</strong><small>${esc(t("duK2Dsub"))}</small></button>
      </div>
      <div class="kicker" style="margin:16px 0 8px">${esc(t("duDomena"))}</div>
      <select onchange="state.du.domena=this.value;save();go('dualuse')">
        <option value="">${esc(t("duDomenaVyber"))}</option>
        ${du.domeny.map(d=>`<option value="${esc(d.id)}" ${d.id===s.domena?"selected":""}>${esc(d.nazev)}</option>`).join("")}
      </select>
      <div class="kicker" style="margin:16px 0 8px">${esc(t("duUseCase"))}</div>
      <textarea rows="3" placeholder="${esc(t("duPlaceholder"))}" onchange="state.du.popis=this.value;save()">${esc(s.popis)}</textarea>
    </div>`);

  if(!s.domena) {
    el.insertAdjacentHTML("beforeend", `<div class="card" style="color:var(--muted)">${esc(t("duVyberte"))}</div>`);
    return;
  }
  const d = du.domeny.find(x=>x.id===s.domena);
  if(!d) return;
  const d2k = s.smer==="d2k";

  el.insertAdjacentHTML("beforeend", `
    <div class="card">
      <div class="kicker" style="margin-bottom:10px">${esc(d.nazev)} – ${esc(t("duMapa"))} ${d2k?esc(t("duD2K")):esc(t("duK2D"))}</div>
      <div style="display:grid;grid-template-columns:1fr 28px 1fr;gap:10px;align-items:start">
        <div>
          <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:${d2k?"var(--navy)":"var(--muted)"};margin-bottom:8px">${d2k?esc(t("duOdkudDef")):esc(t("duKamDef"))}</div>
          ${d.defence.map(x=>`<div class="pill" style="display:flex;margin-bottom:6px">${esc(x)}</div>`).join("")}
        </div>
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--blue);font-size:20px">${d2k?"→":"←"}</div>
        <div>
          <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:${d2k?"var(--muted)":"var(--navy)"};margin-bottom:8px">${d2k?esc(t("duKamKom")):esc(t("duOdkudKom"))}</div>
          ${d.komercni.map(x=>`<div style="background:var(--greenSoft);border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:12px;line-height:1.4"><strong>${esc(x.sektor)}</strong><br><span style="color:var(--muted)">${esc(x.useCase)}</span></div>`).join("")}
        </div>
      </div>
    </div>`);

  const zmeny = d2k ? du.zmenyDefenceKomercni : du.zmenyKomercniDefence;
  el.insertAdjacentHTML("beforeend", `
    <div class="card tablewrap">
      <div class="kicker" style="margin-bottom:10px">${esc(t("duZmeny"))}</div>
      <table class="zmeny">
        <tr><th></th><th>${d2k?esc(t("duSvetObr")):esc(t("duSvetKom"))}</th><th>${d2k?esc(t("duSvetKom")):esc(t("duSvetObr"))}</th></tr>
        ${zmeny.map(z=>`<tr><td><strong>${esc(z.co)}</strong></td><td>${esc(z.z)}</td><td>${esc(z.na)}</td></tr>`).join("")}
      </table>
    </div>`);

  const kroky = d2k ? du.dalsiKroky.defenceKomercni : du.dalsiKroky.komercniDefence;
  const cilZamereni = d2k ? ["civil","dual"] : ["defence","dual"];
  const progs = kb.programy.filter(p=>cilZamereni.includes(p.zamereni)).slice(0,4);
  el.insertAdjacentHTML("beforeend", `
    <div class="card">
      <div class="kicker" style="margin-bottom:10px">${esc(t("duKroky"))}</div>
      ${kroky.map((k,i)=>`<div style="display:flex;gap:12px;padding:6px 0;line-height:1.5"><span class="mono" style="flex:none;width:24px;height:24px;border-radius:50%;background:var(--blueSoft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600">${i+1}</span><span style="font-size:13px">${esc(k)}</span></div>`).join("")}
    </div>
    <div class="card" style="background:var(--blueSoft);border-color:#C9D8F2">
      <div class="kicker" style="margin-bottom:8px;color:var(--blue)">${esc(t("duProgramy"))}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${progs.map(p=>`<button class="btn ghost" style="padding:8px 14px;font-size:12.5px;background:#fff" onclick="go('program','${esc(p.id)}')">${esc(p.nazev)}</button>`).join("")}
      </div>
    </div>
    <div class="card" style="border-style:dashed;color:var(--muted);font-size:12.5px;line-height:1.55">${t("duBeta")}</div>`);
}

// =====================================================================
// 5) KNOWLEDGE BASE (správa obsahu)
// =====================================================================
function vKB(el){
  const kb = KB();
  header(el, t("kbKicker"), t("kbTitle"), t("kbSub"));

  const overitPocet = kb.programy.filter(p=>p.overit||p.terminyOverit).length;
  const soubor = state.lang==="en" ? "kb-en.js" : "kb.js";
  const jazyk = state.lang==="en" ? "EN" : "CZ";

  el.insertAdjacentHTML("beforeend", `
    <div class="card">
      <div class="kicker" style="margin-bottom:6px">${esc(t("kbStav"))}</div>
      <div style="font-size:13px">${esc(t("kbPocty",{p:kb.programy.length,v:(kb.vyzvy||[]).length,d:kb.dualUse.domeny.length,ver:kb.meta.verze,akt:kb.meta.aktualizovano}))}</div>
      ${overitPocet?`<div style="margin-top:8px;font-size:12.5px;color:#9A7B1E;background:#FDF3DC;border-radius:8px;padding:8px 12px">${t("kbOverit",{n:overitPocet})}</div>`:""}
      ${state["kbOverride_"+state.lang]?`<div style="margin-top:8px;font-size:12.5px;color:var(--blue);background:var(--blueSoft);border-radius:8px;padding:8px 12px">${esc(t("kbOverride",{l:jazyk}))} <a href="#" onclick="delete state['kbOverride_'+state.lang];save();go('kb');return false">${esc(t("kbVratit"))} ${esc(soubor)}</a></div>`:""}
    </div>
    <div class="card">
      <div class="kicker" style="margin-bottom:10px">${esc(t("kbEditor",{l:jazyk}))}</div>
      <textarea id="kbEditor" rows="18" class="mono cscroll" style="font-size:11.5px;white-space:pre" spellcheck="false">${esc(JSON.stringify(kb, null, 2))}</textarea>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
        <button class="btn" onclick="ulozKB()">${esc(t("kbUlozit"))}</button>
        <button class="btn ghost" onclick="exportKB()">${esc(t("kbExport",{f:soubor}))}</button>
      </div>
      <div id="kbMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>`);
}
function ulozKB(){
  const txt = document.getElementById("kbEditor").value;
  const msg = document.getElementById("kbMsg");
  try{ JSON.parse(txt); state["kbOverride_"+state.lang] = txt; save(); msg.style.color="var(--green)"; msg.textContent=t("kbUlozeno"); applyChrome(); }
  catch(e){ msg.style.color="var(--clay)"; msg.textContent=t("kbChyba")+e.message; }
}
function exportKB(){
  const txt = document.getElementById("kbEditor").value;
  const varName = state.lang==="en" ? "DH_KB_EN" : "DH_KB";
  const fname = state.lang==="en" ? "kb-en.js" : "kb.js";
  try{
    const obj = JSON.parse(txt);
    const src = "// DH Kompas – knowledge base ("+state.lang+", export "+new Date().toISOString().slice(0,10)+")\nwindow."+varName+" = " + JSON.stringify(obj, null, 2) + ";\n";
    const blob = new Blob([src], {type:"text/javascript"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = fname; a.click();
    URL.revokeObjectURL(a.href);
  }catch(e){
    const msg = document.getElementById("kbMsg");
    msg.style.color="var(--clay)"; msg.textContent=t("kbChyba")+e.message;
  }
}

// ---------------- start ----------------
// Admin režim: záložka Knowledge base je pro tým DH, ne pro startupy.
// Zapíná se otevřením adresy s #admin, vypíná s #noadmin. Je to jen
// skrytí v menu (obsah KB je stejně veřejný v kb.js) – skutečná správa
// obsahu se dělá v repozitáři.
function aplikujAdmin(){
  if(location.hash === "#admin"){ state.admin = true; save(); }
  if(location.hash === "#noadmin"){ state.admin = false; save(); }
  document.getElementById("navKb").style.display = state.admin ? "" : "none";
  if(!state.admin && state.view === "kb"){ state.view = "wizard"; save(); go("wizard"); }
}
window.addEventListener("hashchange", aplikujAdmin);
aplikujAdmin();
if(!state.admin && state.view === "kb") state.view = "wizard";
applyChrome();
go(state.view && views[state.view] ? state.view : "wizard", state.viewParam);
</script>
