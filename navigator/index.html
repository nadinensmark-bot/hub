<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DH Kompas – průvodce EU programy pro defence & dual-use startupy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0B1530; --navy:#13234E; --navy2:#1C2F63; --blue:#2B5CC4; --blueSoft:#E8EEFA;
  --steel:#3E7CA8; --green:#6E9152; --greenSoft:#ECF1E5; --clay:#BD6B4B; --claySoft:#F7ECE6;
  --paper:#FBFBFC; --mist:#F3F5F9; --line:#E2E7F0; --muted:#5C6886;
}
*{box-sizing:border-box}
::selection{background:var(--blue);color:#fff}
html,body{margin:0;padding:0;height:100%}
body{background:var(--mist);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;color:var(--navy);font-size:14px}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
a{color:var(--blue)}
.mono{font-family:'IBM Plex Mono',monospace}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
@keyframes cfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:cfade .35s ease both}
.cscroll::-webkit-scrollbar{width:8px;height:8px}
.cscroll::-webkit-scrollbar-thumb{background:#d3dae8;border-radius:8px}
.cscroll::-webkit-scrollbar-track{background:transparent}

.layout{display:flex;height:100vh;overflow:hidden}
aside{flex:none;width:252px;background:radial-gradient(120% 90% at 20% 0%,#1B2D5E 0%,#0E1B3C 60%,#0B1530 100%);display:flex;flex-direction:column;padding:22px 16px 16px;color:#fff}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:500;color:#C7D0E6}
.navitem:hover{background:rgba(255,255,255,.06)}
.navitem.active{background:rgba(43,92,196,.35);color:#fff}
.navitem svg{flex:none}
.langbtn{flex:1;text-align:center;padding:5px 0;border-radius:8px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.08em;color:#7E8FB8}
.langbtn.active{background:rgba(43,92,196,.4);color:#fff}
main{flex:1;overflow-y:auto;padding:34px 40px 60px}
.wrap{max-width:880px;margin:0 auto}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;border:none;border-radius:11px;padding:11px 20px;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer}
.btn:hover{background:#2450AC}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--blueSoft)}
.btn:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;font-weight:600}
.tag.grant{background:var(--greenSoft);color:var(--green)}
.tag.equity{background:var(--claySoft);color:var(--clay)}
.tag.akcelerator{background:var(--blueSoft);color:var(--blue)}
.tag.mix{background:#EFEAF7;color:#6B4BAA}
.tag.pujcky{background:var(--mist);color:var(--muted)}
.tag.overit{background:#FDF3DC;color:#9A7B1E}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:9px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--navy)}
.opt:hover{border-color:var(--blue);background:var(--blueSoft)}
.opt.sel{border-color:var(--blue);background:var(--blueSoft);box-shadow:0 0 0 1px var(--blue) inset}
.opt small{display:block;color:var(--muted);margin-top:3px;font-size:12px}
.chip{display:inline-block;border:1.5px solid var(--line);border-radius:20px;padding:7px 14px;margin:0 7px 8px 0;cursor:pointer;font-size:12.5px;background:var(--paper)}
.chip:hover{border-color:var(--blue)}
.chip.sel{border-color:var(--blue);background:var(--blueSoft);font-weight:600}
.ynrow{display:flex;gap:8px}
.ynrow .opt{flex:1;text-align:center;margin:0;padding:9px 8px;font-size:13px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--blue);border-radius:6px;transition:width .3s}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:none}
.check input{margin-top:2px;accent-color:var(--green)}
.check.done span{color:var(--muted);text-decoration:line-through}
textarea,select,input[type=text]{width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px}
textarea:focus,select:focus,input:focus{outline:none;border-color:var(--blue)}
table.zmeny{width:100%;border-collapse:collapse;font-size:13px}
table.zmeny th{text-align:left;padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
table.zmeny td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.scorebar{flex:none;width:110px;height:7px;background:var(--line);border-radius:6px;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--mist);border-radius:8px;padding:4px 10px;margin:2px 4px 2px 0}
.subtab{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);border:1.5px solid var(--line);background:var(--paper)}
.subtab.active{color:#fff;background:var(--blue);border-color:var(--blue)}
.tablewrap{overflow-x:auto}
@media(max-width:760px){
  .layout{flex-direction:column}
  aside{width:100%;flex-direction:row;align-items:center;padding:12px 14px;overflow-x:auto}
  aside nav{flex-direction:row!important}
  main{padding:20px 16px 50px}
  .hidemobile{display:none!important}
}
</style>
</head>
<body>
<div class="layout">

  <!-- ============ SIDEBAR ============ -->

  if(s === undefined) s = UI.cs[key];
  if(typeof s === "string" && vars) for(const k in vars) s = s.split("{"+k+"}").join(vars[k]);
  return s;
}

// KB podle jazyka; lokální úpravy (záložka Knowledge base) mají přednost
function KB(){
  const ov = state["kbOverride_"+state.lang];
  if(ov){ try{ return JSON.parse(ov); }catch(e){} }
  return state.lang==="en" ? window.DH_KB_EN : window.DH_KB;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ---------------- jazyk ----------------
function setLang(l){
  state.lang = l; save();
  applyChrome();
  go(state.view || "wizard", state.viewParam);
}
function applyChrome(){
  document.documentElement.lang = state.lang;
  document.getElementById("langCs").classList.toggle("active", state.lang==="cs");
  document.getElementById("langEn").classList.toggle("active", state.lang==="en");
  document.getElementById("navKicker").textContent = t("navKicker");
  document.getElementById("kontaktKicker").textContent = t("kontaktKicker");
  document.getElementById("kontaktText").textContent = t("kontaktText");
  const nav = t("nav");
  document.querySelectorAll("[data-nav]").forEach(el=>{ el.textContent = nav[el.dataset.nav]; });
  document.getElementById("kbVerze").textContent = "KB " + (KB().meta.verze||"");
  const n = aktivniVyzvy(KB()).filter(x=>x.s.rank<3).length;
  const b = document.getElementById("vyzvyBadge");
  b.textContent = n||""; b.style.display = n?"inline-block":"none";
}

// ---------------- routing ----------------
const views = { konzultant: vKonzultant, wizard: vWizard, programy: vProgramy, vyzvy: vVyzvy, prihlaska: vPrihlaska, dualuse: vDualUse, poradce: vPoradce, kb: vKB, program: vProgramDetail };
function go(view, param){
  state.view = view; state.viewParam = param; save();
  document.querySelectorAll(".navitem").forEach(n=>n.classList.toggle("active", n.dataset.view===view || (view==="program" && n.dataset.view==="programy")));
  const el = document.getElementById("app");
  el.innerHTML = ""; el.className = "wrap fade";
  (views[view]||vWizard)(el, param);
  document.querySelector("main").scrollTop = 0;
  void el.offsetWidth;
}
function header(el, kicker, title, sub){
  el.insertAdjacentHTML("beforeend",
    `<div style="margin-bottom:22px">
       <div class="kicker">${esc(kicker)}</div>
       <h1 style="font-size:26px;margin:6px 0 4px">${esc(title)}</h1>
       ${sub?`<div style="color:var(--muted);font-size:14px;max-width:640px;line-height:1.5">${esc(sub)}</div>`:""}
     </div>`);
}
function overitTag(on){ return on?` <span class="tag overit" title="${esc(t("overitTitle"))}">${esc(t("overit"))}</span>`:""; }

// ---------------- výzvy: výpočet stavu z dat v KB ----------------
function fmtDatum(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return state.lang==="en"
    ? d.toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"})
    : d.getDate()+". "+(d.getMonth()+1)+". "+d.getFullYear();
}
function stavVyzvy(v){
  // Vrací {rank, text, barva, bg}; rank řídí řazení (nejnaléhavější první)
  if(v.stavRucne)
    return { rank:1.5, text:v.stavRucne, barva:"var(--steel)", bg:"var(--blueSoft)" };
  const od = Date.parse(v.otevreniOd), uz = Date.parse(v.uzaverka);
  const dnes = Date.now();
  if(!isNaN(od) && od > dnes)
    return { rank:2, text:t("stPlan",{d:fmtDatum(v.otevreniOd)}), barva:"var(--steel)", bg:"var(--blueSoft)" };
  if(isNaN(uz))
    return { rank:3, text:t("stNezn"), barva:"#9A7B1E", bg:"#FDF3DC" };
  const dny = Math.ceil((uz - dnes) / 86400000);
  if(dny < 0)  return { rank:4, text:t("stPo",{d:fmtDatum(v.uzaverka)}), barva:"var(--muted)", bg:"var(--mist)" };
  if(dny <= 30) return { rank:0, text:t("stBrzy",{n:dny,d:fmtDatum(v.uzaverka)}), barva:"var(--clay)", bg:"var(--claySoft)" };
  return { rank:1, text:t("stOtevrena",{d:fmtDatum(v.uzaverka)}), barva:"var(--green)", bg:"var(--greenSoft)" };
}
function seznamVyzev(kb){
  // vyzvy.js (generované z data/vyzvy.csv, případně z Google tabulky)
  // má přednost před polem vyzvy v kb.js/kb-en.js
  if(window.DH_VYZVY){
    const l = window.DH_VYZVY[state.lang==="en" ? "en" : "cs"];
    if(Array.isArray(l) && l.length) return l;
  }
  return kb.vyzvy || [];
}
function aktivniVyzvy(kb, programId){
  return seznamVyzev(kb)
    .filter(v=>!programId || v.program===programId)
    .map(v=>({v, s:stavVyzvy(v)}))
    .sort((a,b)=>a.s.rank-b.s.rank);
}
function stariKB(kb){
  const d = Date.parse(kb.meta.aktualizovano);
  return isNaN(d) ? null : Math.floor((Date.now()-d)/86400000);
}

// 1) PRŮVODCE (wizard)
// =====================================================================
function vWizard(el){
  const kb = KB();
  const otazky = kb.wizard;
  if(!state.odpovedi) state.odpovedi = {};
  const zodpovezeno = otazky.filter(o=>state.odpovedi[o.id]).length;
  const hotovo = zodpovezeno === otazky.length;

  header(el, t("wizKicker"), t("wizTitle"), t("wizSub",{n:otazky.length}));

  // aktuální krok: uložený, jinak první nezodpovězená otázka
  let krok = state.wizKrok;
  if(typeof krok !== "number"){
    const prvni = otazky.findIndex(q=>!state.odpovedi[q.id]);
    krok = prvni === -1 ? otazky.length : prvni;
  }
  krok = Math.max(0, Math.min(krok, otazky.length));
  if(krok >= otazky.length && !hotovo){
    krok = otazky.findIndex(q=>!state.odpovedi[q.id]);
  }

  el.insertAdjacentHTML("beforeend",
    `<div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
       <div class="bar" style="flex:1"><div style="width:${(zodpovezeno/otazky.length)*100}%"></div></div>
       <div class="mono" style="font-size:11px;color:var(--muted)">${zodpovezeno}/${otazky.length}</div>
       ${zodpovezeno?`<button class="btn ghost" style="padding:7px 14px;font-size:12px" onclick="state.odpovedi={};state.wizKrok=0;save();go('wizard')">${esc(t("znovu"))}</button>`:""}
     </div>`);

  if(krok < otazky.length){
    // jedna otázka na obrazovce; zodpovězené mizí, zpět se dá vracet
    const o = otazky[krok];
    const odp = state.odpovedi[o.id];
    const div = document.createElement("div");
    div.className = "card fade";
    div.innerHTML = `<div class="kicker" style="margin-bottom:4px">${esc(t("otazka",{n:krok+1}))} / ${otazky.length}</div>
      <h3 style="font-size:16px;margin:0 0 ${o.napoveda?"4":"12"}px">${esc(o.otazka)}</h3>
      ${o.napoveda?`<div style="color:var(--muted);font-size:12.5px;margin-bottom:12px">${esc(o.napoveda)}</div>`:""}`;
    o.moznosti.forEach(m=>{
      const b = document.createElement("button");
      b.className = "opt" + (odp===m.v ? " sel":"");
      b.innerHTML = `<strong>${esc(m.t)}</strong>${m.p?`<small>${esc(m.p)}</small>`:""}`;
      b.onclick = ()=>{ state.odpovedi[o.id]=m.v; state.wizKrok=krok+1; save(); go("wizard"); };
      div.appendChild(b);
    });
    if(krok > 0){
      const back = document.createElement("button");
      back.className = "btn ghost";
      back.style.cssText = "margin-top:6px;padding:8px 16px;font-size:12.5px";
      back.textContent = t("wizZpet");
      back.onclick = ()=>{ state.wizKrok = krok-1; save(); go("wizard"); };
      div.appendChild(back);
    }
    el.appendChild(div);
    return;
  }

  // všechny otázky zodpovězené → jen výsledky
  el.insertAdjacentHTML("beforeend",
    `<div style="margin-bottom:14px"><button class="btn ghost" style="padding:8px 16px;font-size:12.5px" onclick="state.wizKrok=${otazky.length-1};save();go('wizard')">${esc(t("wizUpravit"))}</button></div>`);
  renderVysledky(el, kb);
}

function skoreProgramu(p, o){
  // Vrací {skore 0-100, plusy[], minusy[]}
  const plusy=[], minusy=[]; let s=0, max=0;

  max+=3; // zaměření
  if(o.zamereni==="nevim"){ s+=2; }
  else if(p.zamereni===o.zamereni){ s+=3; plusy.push(t("sZamereniOk",{z:t("zamereni")[p.zamereni]})); }
  else if(p.zamereni==="dual"){ s+=2; plusy.push(t("sDualOk")); }
  else { minusy.push(t("sZamereniNe",{z:t("zamereniJine")[p.zamereni]})); }

  max+=3; // TRL
  const [omin,omax] = o.trl.split("-").map(Number);
  if(omax >= p.trl[0] && omin <= p.trl[1]){ s+=3; plusy.push(t("sTrlOk",{a:o.trl,b:p.trl[0]+"–"+p.trl[1]})); }
  else minusy.push(t("sTrlNe",{a:o.trl,b:p.trl[0]+"–"+p.trl[1]}));

  max+=2; // typ podpory
  if(o.typ==="vse"){ s+=2; }
  else if(p.typ===o.typ || p.typ==="mix"){ s+=2; plusy.push(t("sTypOk")); }
  else minusy.push(t("sTypNe",{a:t("typNabizi")[p.typ],b:t("typHledam")[o.typ]}));

  max+=2; // konsorcium
  if(p.konsorcium && o.konsorcium==="ne"){ minusy.push(t("sKonsNe")); }
  else { s+=2; plusy.push(p.konsorcium ? t("sKonsOk1") : t("sKonsOk2")); }

  max+=1; // velikost
  if(p.velikost.includes(o.velikost)){ s+=1; }
  else minusy.push(t("sVelNe"));

  return { skore: Math.round((s/max)*100), plusy, minusy };
}

function renderVysledky(el, kb){
  const o = state.odpovedi;
  // Tvrdé filtry: co nevyhovuje, se vůbec neukáže (jenInfo, typ žadatele,
  // zaměření, TRL fáze, konsorcium, forma podpory). Zbytek se řadí skóre.
  const [tmin, tmax] = o.trl.split("-").map(Number);
  const typOk = p => o.typ === "vse"
    || (o.typ === "grant" && (p.typ === "grant" || p.typ === "mix" || p.typ === "akcelerator"))
    || (o.typ === "equity" && (p.typ === "equity" || p.typ === "mix"))
    || (o.typ === "akcelerator" && (p.typ === "akcelerator" || p.typ === "mix"));
  const zamereniOk = p => o.zamereni === "nevim" || o.zamereni === "dual"
    || p.zamereni === "dual" || p.zamereni === o.zamereni;
  const nabidka = kb.programy.filter(p=>!p.jenInfo);
  const povolene = nabidka.filter(p =>
    (!p.jenPro || p.jenPro.includes(o.velikost)) &&
    zamereniOk(p) &&
    (tmax >= p.trl[0] && tmin <= p.trl[1]) &&
    !(p.konsorcium && o.konsorcium === "ne") &&
    typOk(p)
  );
  const skryto = nabidka.length - povolene.length;
  const vysledky = povolene.map(p=>({p, ...skoreProgramu(p,o)})).sort((a,b)=>b.skore-a.skore);
  const div = document.createElement("div");
  div.innerHTML = `<div style="display:flex;align-items:center;gap:10px;margin:26px 0 14px">
    <h2 style="font-size:20px;margin:0">${esc(t("vysledky"))}</h2>
    <span class="mono" style="font-size:10px;color:var(--muted)">${esc(t("vysledkySub"))}</span></div>`;
  if(skryto > 0){
    div.insertAdjacentHTML("beforeend",
      `<div style="font-size:12.5px;color:var(--muted);background:var(--mist);border-radius:10px;padding:8px 13px;margin-bottom:12px">ℹ ${esc(t("wizSkryto",{n:skryto,role:t("velikostL")[o.velikost]||o.velikost}))}</div>`);
  }
  if(vysledky.length === 0){
    div.insertAdjacentHTML("beforeend",
      `<div class="card" style="background:var(--blueSoft);border-color:#C9D8F2">${esc(t("wizNicPozn"))} ${esc(kb.meta.kontakt)}</div>`);
    el.appendChild(div);
    return;
  }
  vysledky.forEach((v,idx)=>{
    const c = v.skore>=70 ? "var(--green)" : v.skore>=45 ? "var(--steel)" : "var(--clay)";
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span class="mono" style="font-size:11px;color:var(--muted)">#${idx+1}</span>
        <h3 style="font-size:16px;margin:0;flex:1;min-width:180px">${esc(v.p.nazev)}</h3>
        <span class="tag ${esc(v.p.typ)}">${esc(t("typ")[v.p.typ]||v.p.typ)}</span>
        <div class="scorebar"><div style="width:${v.skore}%;height:100%;background:${c}"></div></div>
        <span class="mono" style="font-size:12px;font-weight:600;color:${c};width:38px;text-align:right">${v.skore}%</span>
      </div>
      <div style="color:var(--muted);font-size:13px;margin:8px 0 10px">${esc(v.p.kratce)}</div>
      ${aktivniVyzvy(kb, v.p.id).filter(x=>x.s.rank<3).slice(0,1).map(x=>`<div style="display:inline-block;font-size:11.5px;font-weight:600;color:${x.s.barva};background:${x.s.bg};border-radius:8px;padding:4px 10px;margin-bottom:8px">◷ ${esc(x.s.text)}</div>`).join("")}
      ${v.plusy.slice(0,3).map(x=>`<div style="display:flex;gap:8px;font-size:12.5px;padding:2px 0"><span style="color:var(--green)">✓</span><span>${esc(x)}</span></div>`).join("")}
      ${v.minusy.slice(0,2).map(x=>`<div style="display:flex;gap:8px;font-size:12.5px;padding:2px 0"><span style="color:var(--clay)">✕</span><span style="color:var(--muted)">${esc(x)}</span></div>`).join("")}
      <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn ghost" style="padding:8px 14px;font-size:12.5px" onclick="go('program','${esc(v.p.id)}')">${esc(t("detailBtn"))}</button>
        <button class="btn ghost" style="padding:8px 14px;font-size:12.5px" onclick="state.prihlaskaProgram='${esc(v.p.id)}';save();go('prihlaska')">${esc(t("prihlaskaBtn"))}</button>
      </div>`;
    div.appendChild(card);
  });
  div.insertAdjacentHTML("beforeend",
    `<div class="card" style="background:var(--blueSoft);border-color:#C9D8F2">
       <strong>${esc(t("dalsiKrok"))}</strong> ${esc(t("dalsiKrokText"))} ${esc(kb.meta.kontakt)}
     </div>`);
  el.appendChild(div);
}

function vVyzvy(el){
  const kb = KB();
  header(el, t("vyzKicker"), t("vyzTitle"), t("vyzSub"));

  const stari = stariKB(kb);
  if(stari !== null && stari > 60){
    el.insertAdjacentHTML("beforeend",
      `<div class="card" style="background:#FDF3DC;border-color:#EAD9A8;color:#9A7B1E">${esc(t("vyzStale",{n:stari,d:fmtDatum(kb.meta.aktualizovano)}))}</div>`);
  }

  const seznam = aktivniVyzvy(kb);
  if(!seznam.length){
    el.insertAdjacentHTML("beforeend", `<div class="card" style="color:var(--muted)">${esc(t("vyzEmpty"))}</div>`);
    return;
  }
  seznam.forEach(({v,s})=>{
    const p = kb.programy.find(x=>x.id===v.program);
    el.insertAdjacentHTML("beforeend",
      `<div class="card" style="${s.rank===4?"opacity:.55;":""}">
         <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
           <h3 style="font-size:15px;margin:0;flex:1;min-width:200px">${esc(v.nazev)}${v.priklad?` <span class="tag overit">${esc(t("ukazka"))}</span>`:""}</h3>
           <span class="tag" style="background:${s.bg};color:${s.barva}">${esc(s.text)}</span>

// kontrolní součet IČO (vážený součet mod 11) – chytá překlepy
function icoValidni(ico){
  if(!/^\d{8}$/.test(ico)) return false;
  let s = 0;
  for(let i = 0; i < 7; i++) s += +ico[i] * (8 - i);
  const z = s % 11;
  return +ico[7] === (z === 0 ? 1 : z === 1 ? 0 : 11 - z);
}
function profilText(){
  const f = state.firma;
  if(!f || !f.hotovo) return "";
  const L = t("velikostL");
  const en = state.lang === "en";
  return [
    f.nazev ? (en ? "Company: " : "Firma: ") + f.nazev : "",
    f.ico ? ("IČO: " + f.ico) : "",
    (en ? "What they do: " : "Co dělá: ") + f.popis,
    (en ? "Focus: " : "Zaměření: ") + f.zamereni,
    "TRL: " + f.trl,
    (en ? "Applicant type: " : "Typ žadatele: ") + (L[f.velikost] || f.velikost),
    (en ? "Support sought: " : "Hledaná podpora: ") + f.typ,
    (en ? "Consortium possible: " : "Konsorcium možné: ") + f.konsorcium
  ].filter(Boolean).join(" | ").slice(0, 1400);
}
async function odesliLead(){
  const f = state.firma;
  if(!backendUrl() || !f.email || !f.souhlas) return;
  try{
    const r = await fetch(backendUrl() + "/api/lead", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ firma: f.nazev, ico: f.ico || "", email: f.email, profil: profilText(), souhlas: true, lang: state.lang })
    });
    f.odeslano = r.ok; save();
  }catch(e){ f.odeslano = false; save(); }
  // překreslit dashboard, aby se ukázal stav odeslání
  if(state.view === "konzultant" && !state.firmaEdit) go("konzultant");
}

    s.popis = cp.querySelector("#duPopisPole").value.trim();
    // skóre 1 = jediné slabé slovo, často náhodná shoda podřetězce – nehádat
    const shody = s.popis ? duNajdiKategorie(s.popis, kb).filter(x=>x.skore>=2).slice(0,2) : [];
    s.kategorie = shody.map(x=>x.k.kod);

      ${o.napoveda?`<div style="color:var(--muted);font-size:12px;margin-bottom:8px">${esc(o.napoveda)}</div>`:""}`;
    ynRow(row, a[o.id], v=>{ a[o.id]=v; });
    card.appendChild(row);
  }

  // 2) kategorie přílohy I – navržené z popisu; ruční výběr jen jako oprava
  const ka = test.kategorieAnnex;
  const vybraneKat = s.kategorie.filter(k=>k!=="zadna");
  const ukazRucne = !!s.rucne;
  const c2 = document.createElement("div");
  c2.className = "card";
  if(vybraneKat.length){
    c2.innerHTML = `<div style="font-size:13.5px;font-weight:600;margin-bottom:3px">${esc(t("duNalezeno"))}</div>
      <div style="color:var(--muted);font-size:12px;margin-bottom:4px">${esc(t("duNalezenoPozn"))}</div>`;
  } else if(s.kategorie.includes("zadna")){
    c2.innerHTML = `<div style="color:var(--muted);font-size:13px;margin-bottom:4px">${esc(ka.zadna)}</div>`;
  } else if(s.analyzovano){
    c2.innerHTML = `<div style="font-size:13px;line-height:1.55;margin-bottom:4px">${esc(t("duNenalezeno"))}</div>`;
  } else {
    c2.innerHTML = `<div style="color:var(--muted);font-size:13px;margin-bottom:4px">${esc(t("duCekaNaPopis"))}</div>`;
  }

  // U každé vybrané kategorie: výběr konkrétních podoblastí ("co z toho děláte"),
  // ukázka rozhodujících parametrů, volitelné pole parametrů a prahová otázka.
  s.kategorie.filter(k=>k!=="zadna").forEach(kod=>{
    const p = ka.polozky.find(x=>x.kod===kod);
    if(!p) return;
    const podoblasti = p.podoblasti || p.priklady.map(x=>({nazev:x, rozhoduje:""}));
    const vybranePod = s.pod[kod] || null; // null = ještě nevybráno, [] = "nic z toho"
    const box = document.createElement("div");
    box.style.cssText = "margin-top:14px;padding:14px 16px;background:var(--mist);border-radius:12px";
    box.innerHTML = `<div class="kicker" style="margin-bottom:4px">${esc(t("duKategorie",{k:p.kod}))}</div>
      <div style="font-size:13.5px;font-weight:600;margin-bottom:8px">${esc(p.nazev)}</div>
      <div style="font-size:12.5px;font-weight:600;margin-bottom:6px">${esc(t("duPodVyber"))}</div>`;
    const rada = document.createElement("div");
    podoblasti.forEach((po, idx)=>{
      const ch = document.createElement("span");
      ch.className = "chip" + (vybranePod && vybranePod.includes(idx) ? " sel" : "");
      ch.style.background = "#fff";
      ch.textContent = po.nazev;
      ch.onclick = ()=>{
        let sez = (s.pod[kod] || []).slice();
        sez.includes(idx) ? sez = sez.filter(x=>x!==idx) : sez.push(idx);
        s.pod[kod] = sez;
        if(!sez.length) delete s.prahy[kod];
        save(); go("dualuse");
      };
      rada.appendChild(ch);
    });
    const nic = document.createElement("span");
    nic.className = "chip" + (vybranePod && vybranePod.length===0 ? " sel" : "");
    nic.style.background = "#fff";
    nic.textContent = t("duPodNic");
    nic.onclick = ()=>{ s.pod[kod] = []; delete s.prahy[kod]; delete s.parametry[kod]; save(); go("dualuse"); };
    rada.appendChild(nic);
    box.appendChild(rada);

    if(vybranePod && vybranePod.length){
      const detaily = document.createElement("div");
      detaily.innerHTML = `<div style="font-size:12px;color:var(--muted);margin:10px 0 4px">${esc(t("duRozhoduje"))}</div>
        ${vybranePod.map(idx=>`<div style="display:flex;gap:8px;font-size:12.5px;padding:2px 0"><span style="color:var(--blue)">›</span><span><strong>${esc(podoblasti[idx].nazev)}</strong>${podoblasti[idx].rozhoduje?" — "+esc(podoblasti[idx].rozhoduje):""}</span></div>`).join("")}
        <div style="font-size:12px;color:var(--muted);margin:10px 0 4px">${esc(t("duParamPole"))}</div>`;
      const pole = document.createElement("input");
      pole.type = "text"; pole.placeholder = t("duParamPlaceholder");
      pole.value = s.parametry[kod] || "";
      pole.onchange = ()=>{ s.parametry[kod] = pole.value; save(); };
      detaily.appendChild(pole);
      detaily.insertAdjacentHTML("beforeend",
        `<div style="font-size:13px;font-weight:600;margin:12px 0 3px">${esc(t("duPrahy"))}</div>
         <div style="color:var(--muted);font-size:11.5px;margin-bottom:8px">${esc(t("duPrahyPozn"))}</div>`);
      ynRow(detaily, s.prahy[kod], v=>{ s.prahy[kod]=v; },
        [["ano",t("duPrahyAno")],["ne",t("duPrahyNe")],["nevim",t("duPrahyNevim")]]);
      box.appendChild(detaily);
    }
    c2.appendChild(box);
  });

  // ruční oprava kategorií (schovaná, dokud ji člověk nechce)
  const prep = document.createElement("div");
  prep.style.cssText = "margin-top:12px";
  const prepBtn = document.createElement("span");
  prepBtn.className = "chip";
  prepBtn.textContent = ukazRucne ? t("duRucneSchovat") : t("duRucneToggle");
  prepBtn.onclick = ()=>{ s.rucne = !ukazRucne; save(); go("dualuse"); };
  prep.appendChild(prepBtn);
  c2.appendChild(prep);
  if(ukazRucne){
    const grid = document.createElement("div");
    grid.style.cssText = "margin-top:10px";
    grid.innerHTML = `<div style="color:var(--muted);font-size:12px;margin-bottom:8px">${esc(ka.napoveda)}</div>`;
    ka.polozky.forEach(p=>{
      const c = document.createElement("span");
      c.className = "chip" + (s.kategorie.includes(p.kod)?" sel":"");
      c.textContent = p.kod+" · "+p.nazev;
      c.onclick = ()=>{
        s.kategorie = s.kategorie.filter(x=>x!=="zadna");
        if(s.kategorie.includes(p.kod)){
          s.kategorie = s.kategorie.filter(x=>x!==p.kod);
          delete s.pod[p.kod]; delete s.prahy[p.kod]; delete s.parametry[p.kod];
        }
        else s.kategorie.push(p.kod);
        s.analyzovano = true;
        save(); go("dualuse");
      };
      grid.appendChild(c);
    });
    const cz = document.createElement("span");
    cz.className = "chip" + (s.kategorie.includes("zadna")?" sel":"");
    cz.textContent = ka.zadna;
    cz.onclick = ()=>{ s.kategorie = s.kategorie.includes("zadna") ? [] : ["zadna"]; s.pod = {}; s.prahy = {}; s.parametry = {}; s.analyzovano = true; save(); go("dualuse"); };
    grid.appendChild(cz);
    c2.appendChild(grid);
  }
  el.appendChild(c2);

  // 3) upřesnění – všechny doplňkové otázky v jedné kartě (až po kategoriích)
  if(s.analyzovano || s.kategorie.length){
    const c3 = document.createElement("div");
    c3.className = "card";
    c3.innerHTML = `<div class="kicker" style="margin-bottom:3px">${esc(t("duUpresneni"))}</div>
      <div style="color:var(--muted);font-size:12px;margin-bottom:4px">${esc(t("duUpresneniPozn"))}</div>`;
    test.otazky.forEach(o=>otazkaRow(c3, o));
    el.appendChild(c3);
  }

  // hotovo? Kategorie je vyřešená = vybráno "nic z toho", nebo vybrané
  // podoblasti + zodpovězená prahová otázka.
  const vybrane = s.kategorie.filter(k=>k!=="zadna");
  const katVyresena = k => Array.isArray(s.pod[k]) && (s.pod[k].length===0 || s.prahy[k]);
  const katHotovo = s.kategorie.includes("zadna") || (vybrane.length>0 && vybrane.every(katVyresena));
  const hotovo = test.otazky.every(o=>a[o.id]) && katHotovo;
  if(!hotovo){
    if(s.analyzovano || s.kategorie.length){
      el.insertAdjacentHTML("beforeend", `<div class="card" style="color:var(--muted)">${esc(t("duTestNedokonceno"))}</div>`);
    }
    return;
  }

  // verdikt podle seznamů → semafor
  const relevantni = vybrane.filter(k=>(s.pod[k]||[]).length>0);
  const katAno = relevantni.some(k=>s.prahy[k]==="ano");
  const katNevim = relevantni.some(k=>s.prahy[k]==="nevim");
  let vId;
  if(a.vojenske==="ano") vId = "vojensky";
  else if(katAno) vId = "listed";
  else if(a.vojenske==="nevim" || katNevim) vId = "zatrideni";
  else vId = "unlisted";
  const v = test.verdikty[vId];
  const semafory = {
    cervena: { emoji:"🔴", fg:"#8A3B24", bg:"var(--claySoft)", br:"#E0BFAF" },
    zluta:   { emoji:"🟡", fg:"#8A6D1B", bg:"#FDF3DC", br:"#EAD9A8" },
    zelena:  { emoji:"🟢", fg:"#4C6B33", bg:"var(--greenSoft)", br:"#C9D8B4" }
  };
  const sem = semafory[v.semafor] || semafory.zluta;
  el.insertAdjacentHTML("beforeend",
    `<div class="card" style="background:${sem.bg};border-color:${sem.br}">
       <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
         <span style="font-size:30px;line-height:1">${sem.emoji}</span>
         <div style="flex:1;min-width:220px">
           <div class="kicker" style="color:${sem.fg}">${esc(t("duVerdikt"))}</div>
           <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:${sem.fg};letter-spacing:.01em">${esc(v.stitek || v.nazev)}</div>
         </div>
       </div>
       <div style="line-height:1.55;font-size:13.5px;margin-top:10px">${esc(v.text)}</div>
       <button class="btn ghost" style="margin-top:12px;padding:7px 14px;font-size:12px;background:#fff" onclick="state.duTest2={odpovedi:{},kategorie:[],katOdpovedi:{},pod:{},prahy:{},parametry:{}};save();go('dualuse')">${esc(t("duZnovu"))}</button>
     </div>`);

  // shrnutí pro konzultaci (zkopírovatelné – obsahuje výběry i zadané parametry)
  const en = state.lang === "en";
  const radkyShrnuti = [];
  radkyShrnuti.push((en ? "DUAL-USE SELF-CHECK – " : "DUAL-USE SEBEHODNOCENÍ – ") + (v.stitek || v.nazev));
  radkyShrnuti.push((en ? "Date: " : "Datum: ") + fmtDatum(new Date().toISOString().slice(0,10)));
  radkyShrnuti.push("");
  test.otazky.forEach(o => { radkyShrnuti.push("• " + o.text + " → " + ({ano:t("ano"),ne:t("ne"),nevim:t("nevim")}[a[o.id]] || a[o.id])); });
  radkyShrnuti.push("");
  if(s.kategorie.includes("zadna")){
    radkyShrnuti.push(en ? "Annex I categories: none selected" : "Kategorie přílohy I: žádná nevybrána");
  } else {
    vybrane.forEach(kod => {
      const p = ka.polozky.find(x=>x.kod===kod);
      const podoblasti = p.podoblasti || [];
      const sez = s.pod[kod] || [];
      radkyShrnuti.push((en ? "Category " : "Kategorie ") + kod + " – " + p.nazev + ":");
      if(!sez.length) radkyShrnuti.push("  " + t("duPodNic"));
      else {
        sez.forEach(idx => radkyShrnuti.push("  • " + (podoblasti[idx] ? podoblasti[idx].nazev : "")));
        if(s.parametry[kod]) radkyShrnuti.push("  " + (en ? "Parameters: " : "Parametry: ") + s.parametry[kod]);
        radkyShrnuti.push("  " + t("duPrahy") + " → " + ({ano:t("duPrahyAno"),ne:t("duPrahyNe"),nevim:t("duPrahyNevim")}[s.prahy[kod]] || ""));
      }
    });
  }
  radkyShrnuti.push("");
  radkyShrnuti.push(test.disclaimer);
  const shrnutiText = radkyShrnuti.join("\n");
  const shrCard = document.createElement("div");
  shrCard.className = "card";
  shrCard.innerHTML = `<div class="kicker" style="margin-bottom:6px">${esc(t("duShrnuti"))}</div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">${esc(t("duShrnutiPozn"))}</div>
    <textarea readonly rows="8" class="mono cscroll" style="font-size:11.5px;white-space:pre">${esc(shrnutiText)}</textarea>
    <button class="btn ghost" style="margin-top:8px;padding:7px 14px;font-size:12px" id="duKopiruj">${esc(t("duKopirovat"))}</button>`;
  shrCard.querySelector("#duKopiruj").onclick = async (ev) => {
    const ta = shrCard.querySelector("textarea");
    try { await navigator.clipboard.writeText(shrnutiText); }
    catch(e){ ta.focus(); ta.select(); try{ document.execCommand("copy"); }catch(_){} }
    ev.target.textContent = t("duZkopirovano");
    setTimeout(()=>{ ev.target.textContent = t("duKopirovat"); }, 2000);
  };
  el.appendChild(shrCard);

  // co dál – kroky podle verdiktu
  if(v.dalsiKroky && v.dalsiKroky.length){
    el.insertAdjacentHTML("beforeend",
      `<div class="card">
         <div class="kicker" style="margin-bottom:10px">${esc(test.dalsiKrokyNadpis||"")}</div>
         ${v.dalsiKroky.map((k,i)=>`<div style="display:flex;gap:12px;padding:6px 0;line-height:1.5"><span class="mono" style="flex:none;width:24px;height:24px;border-radius:50%;background:var(--blueSoft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600">${i+1}</span><span style="font-size:13px">${esc(k)}</span></div>`).join("")}
       </div>`);
  }

  // režimy
  const aktivni = (test.rezimy||[]).filter(r=>{
    const pod = r.podminky||{};
    for(const k in pod){
      if(k==="katAno"){ if(!katAno) return false; }
      else if(k==="katNevim"){ if(!katNevim) return false; }
      else if(a[k]!==pod[k]) return false;
    }
    return true;
  });
  const rez = document.createElement("div");
  rez.className = "card";
  rez.innerHTML = `<div class="kicker" style="margin-bottom:10px">${esc(t("duRezimy"))}</div>`;
  if(!aktivni.length) rez.insertAdjacentHTML("beforeend", `<div style="color:var(--muted);font-size:13px">${esc(t("duRezimyEmpty"))}</div>`);
  aktivni.forEach(r=>{
    rez.insertAdjacentHTML("beforeend",
      `<div style="padding:11px 0;border-bottom:1px solid var(--line)">
         <strong style="font-size:13.5px">${esc(r.nazev)}</strong>
         <div style="font-size:12.5px;margin-top:4px;line-height:1.5"><span style="color:var(--muted)">${esc(t("duKdy"))}</span> ${esc(r.kdy)}</div>
         <div style="font-size:12.5px;margin-top:2px;line-height:1.5"><span style="color:var(--muted)">${esc(t("duAkce"))}</span> ${esc(r.akce)}</div>
       </div>`);
  });
  el.appendChild(rez);

  // oficiální zdroje
  if(test.odkazy && test.odkazy.length){
    el.insertAdjacentHTML("beforeend",
      `<div class="card" style="background:var(--blueSoft);border-color:#C9D8F2">
         <div class="kicker" style="margin-bottom:8px;color:var(--blue)">${esc(t("duOdkazy"))}</div>
         ${test.odkazy.map(o=>`<div style="padding:3px 0;font-size:13px"><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.t)} ↗</a></div>`).join("")}
       </div>`);
  }

  el.insertAdjacentHTML("beforeend",
    `<div class="card" style="background:#FDF3DC;border-color:#EAD9A8;color:#9A7B1E;font-size:12.5px;line-height:1.55">⚠ ${esc(test.disclaimer)}</div>`);
}

// ---------- 4b) překladač use casů ----------
function renderPrekladac(el, kb){
  const du = kb.dualUse;
  if(!state.du) state.du = { smer:"d2k", domena:"", popis:"" };
  const s = state.du;

  el.insertAdjacentHTML("beforeend", `
    <div class="card">
      <div class="kicker" style="margin-bottom:10px">${esc(t("duSmer"))}</div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="opt" style="flex:1;min-width:220px;margin:0;${s.smer==='d2k'?'border-color:var(--blue);background:var(--blueSoft)':''}" onclick="state.du.smer='d2k';save();go('dualuse')">
          <strong>${esc(t("duD2K"))}</strong><small>${esc(t("duD2Ksub"))}</small></button>
        <button class="opt" style="flex:1;min-width:220px;margin:0;${s.smer==='k2d'?'border-color:var(--blue);background:var(--blueSoft)':''}" onclick="state.du.smer='k2d';save();go('dualuse')">
          <strong>${esc(t("duK2D"))}</strong><small>${esc(t("duK2Dsub"))}</small></button>
      </div>
      <div class="kicker" style="margin:16px 0 8px">${esc(t("duDomena"))}</div>
      <select onchange="state.du.domena=this.value;save();go('dualuse')">
        <option value="">${esc(t("duDomenaVyber"))}</option>
        ${du.domeny.map(d=>`<option value="${esc(d.id)}" ${d.id===s.domena?"selected":""}>${esc(d.nazev)}</option>`).join("")}
      </select>
      <div class="kicker" style="margin:16px 0 8px">${esc(t("duUseCase"))}</div>
      <textarea rows="3" placeholder="${esc(t("duPlaceholder"))}" onchange="state.du.popis=this.value;const d=duNajdiDomenu(this.value,KB());if(d){state.du.domena=d;}save();go('dualuse')">${esc(s.popis)}</textarea>
      <div style="color:var(--muted);font-size:11.5px;margin-top:6px">${esc(t("duPopisAuto"))}</div>
    </div>`);

  if(!s.domena) {
    el.insertAdjacentHTML("beforeend", `<div class="card" style="color:var(--muted)">${esc(t("duVyberte"))}</div>`);
    return;
  }
  const d = du.domeny.find(x=>x.id===s.domena);
  if(!d) return;
  const d2k = s.smer==="d2k";

  el.insertAdjacentHTML("beforeend", `
    <div class="card">
      <div class="kicker" style="margin-bottom:10px">${esc(d.nazev)} – ${esc(t("duMapa"))} ${d2k?esc(t("duD2K")):esc(t("duK2D"))}</div>
      <div style="display:grid;grid-template-columns:1fr 28px 1fr;gap:10px;align-items:start">
        <div>
          <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:${d2k?"var(--navy)":"var(--muted)"};margin-bottom:8px">${d2k?esc(t("duOdkudDef")):esc(t("duKamDef"))}</div>
          ${d.defence.map(x=>`<div class="pill" style="display:flex;margin-bottom:6px">${esc(x)}</div>`).join("")}
        </div>
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--blue);font-size:20px">${d2k?"→":"←"}</div>
        <div>
          <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:${d2k?"var(--muted)":"var(--navy)"};margin-bottom:8px">${d2k?esc(t("duKamKom")):esc(t("duOdkudKom"))}</div>
          ${d.komercni.map(x=>`<div style="background:var(--greenSoft);border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:12px;line-height:1.4"><strong>${esc(x.sektor)}</strong><br><span style="color:var(--muted)">${esc(x.useCase)}</span></div>`).join("")}
        </div>
      </div>
    </div>`);

  const zmeny = d2k ? du.zmenyDefenceKomercni : du.zmenyKomercniDefence;
  el.insertAdjacentHTML("beforeend", `
    <div class="card tablewrap">
      <div class="kicker" style="margin-bottom:10px">${esc(t("duZmeny"))}</div>
      <table class="zmeny">
        <tr><th></th><th>${d2k?esc(t("duSvetObr")):esc(t("duSvetKom"))}</th><th>${d2k?esc(t("duSvetKom")):esc(t("duSvetObr"))}</th></tr>
        ${zmeny.map(z=>`<tr><td><strong>${esc(z.co)}</strong></td><td>${esc(z.z)}</td><td>${esc(z.na)}</td></tr>`).join("")}
      </table>
    </div>`);

  const kroky = d2k ? du.dalsiKroky.defenceKomercni : du.dalsiKroky.komercniDefence;
  const cilZamereni = d2k ? ["civil","dual"] : ["defence","dual"];
  const progs = kb.programy.filter(p=>cilZamereni.includes(p.zamereni)).slice(0,4);
  el.insertAdjacentHTML("beforeend", `
    <div class="card">
      <div class="kicker" style="margin-bottom:10px">${esc(t("duKroky"))}</div>
      ${kroky.map((k,i)=>`<div style="display:flex;gap:12px;padding:6px 0;line-height:1.5"><span class="mono" style="flex:none;width:24px;height:24px;border-radius:50%;background:var(--blueSoft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600">${i+1}</span><span style="font-size:13px">${esc(k)}</span></div>`).join("")}
    </div>
    <div class="card" style="background:var(--blueSoft);border-color:#C9D8F2">
      <div class="kicker" style="margin-bottom:8px;color:var(--blue)">${esc(t("duProgramy"))}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${progs.map(p=>`<button class="btn ghost" style="padding:8px 14px;font-size:12.5px;background:#fff" onclick="go('program','${esc(p.id)}')">${esc(p.nazev)}</button>`).join("")}
      </div>
    </div>
    <div class="card" style="border-style:dashed;color:var(--muted);font-size:12.5px;line-height:1.55">${t("duBeta")}</div>`);
}

// =====================================================================
// 4c) PORADCE – chatbot a analýza specifikace (vyžaduje backend)
// =====================================================================
function backendUrl(){ return (window.DH_CONFIG && window.DH_CONFIG.backendUrl || "").replace(/\/+$/, ""); }
// Režim AI poradce: "backend" (ostrý server), "demo" (Claude runtime artefaktu,
// jen když si ho uživatel zapne přepínačem) – jinak null = chat bez AI (výchozí).
function aiRezim(){
  // backend počítá jako AI jen když server hlásí, že AI opravdu má

// mini-markdown: escapuje HTML a převede **tučné**, nadpisy a odrážky
function mdHtml(text){
  const radky = esc(text).split("\n");
  let html = "", vSeznamu = false;
  for(let radek of radky){
    radek = radek.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    radek = radek.replace(/(https?:\/\/[^\s<)]+)/g, "<a href=\"$1\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--blue)\">$1</a>");
    const odrazka = radek.match(/^\s*[-•*]\s+(.*)$/);
    const nadpis = radek.match(/^#{1,4}\s+(.*)$/);
    if(odrazka){
      if(!vSeznamu){ html += "<ul style='margin:4px 0 4px 18px;padding:0'>"; vSeznamu = true; }
      html += "<li style='margin:2px 0'>" + odrazka[1] + "</li>";
    } else {
      if(vSeznamu){ html += "</ul>"; vSeznamu = false; }
      if(nadpis) html += "<div style='font-weight:600;margin:8px 0 2px'>" + nadpis[1] + "</div>";
      else if(radek.trim()) html += "<div style='margin:2px 0'>" + radek + "</div>";
      else html += "<div style='height:6px'></div>";
    }
  }
  if(vSeznamu) html += "</ul>";
  return html;
}

async function poradceDotaz(cesta, telo){
  if(aiRezim() === "demo") return await window.DH_AI_RUNTIME(cesta, telo);
  const res = await fetch(backendUrl() + cesta, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(telo)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.chyba || t("porChyba"));
  return data;
}

// ---------- Poradce lite: vyhledávání ve znalostní bázi (bez AI, zdarma) ----------
function bezDiakritiky(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }

// ---------- dual-use motor: rozpozn\u00e1n\u00ed kategori\u00ed p\u0159\u00edlohy I z voln\u00e9ho popisu ----------
// Sd\u00edl\u00ed ho dual-use modul i chatbot. Synonyma dopl\u0148uj\u00ed slova, kter\u00e1 v textu
// KB nejsou doslova (dron \u2192 kategorie 9 apod.).
const DU_SYNONYMA = {
  "0": ["jader","nuklear","reaktor","uran"],
  "1": ["slitin","kompozit","chemick","povlak","material","cbrn","detekce latek","vlakn"],
  "2": ["cnc","obrabe","lis ","lozisk","vyrobni stroj"],
  "3": ["cip","polovodic","obvod","elektronik","prevodnik","mikrovln"],
  "4": ["pocitac","server","vypocet","computing","superpocitac"],
  "5": ["sifr","krypt","encrypt","radio","komunikac","telekom","vpn","anten","vysilac"],
  "6": ["senzor","kamer","termo","noktoviz","radar","lidar","laser","sonar","hydrofon","optick","noceni videni"],
  "7": ["navigac","gps","gnss","gyroskop","akcelerometr","avionik","inercial"],
  "8": ["ponork","podvodni","namorni","lod "],
  "9": ["dron","uav","bezpilot","letadl","raket","motor","satelit","vesmir","kosm","space","kvadrokopt"]
};
// aliasy pro p\u00e1rov\u00e1n\u00ed podoblast\u00ed (slovo z popisu \u2192 kmen slova v KB)
const DU_ALIASY = { dron: "uav", kvadrokopt: "uav", termoviz: "termovizni", sifrov: "kryptografie", satelit: "kosmicke", ponork: "ponorna", vesmir: "kosmicke" };
function duNajdiKategorie(text, kb){
  const q = " " + bezDiakritiky(text) + " ";
  const slova = bezDiakritiky(text).split(/[^a-z0-9]+/).filter(w => w.length > 3);
  const prelozene = slova.map(w => {
    for(const klic in DU_ALIASY){ if(w.startsWith(klic)) return DU_ALIASY[klic]; }
    return w;
  });
  return kb.dualUseTest.kategorieAnnex.polozky.map(k => {
    const txt = bezDiakritiky(k.nazev + " " + k.priklady.join(" ") + " " + (k.podoblasti||[]).map(p => p.nazev + " " + p.rozhoduje).join(" "));
    let skore = 0;
    for(const w of slova){ if(w.length > 3 && txt.includes(w)) skore += 1; }
    for(const syn of (DU_SYNONYMA[k.kod]||[])){ if(q.includes(syn)) skore += 3; }
    // kter\u00e9 podoblasti z popisu sed\u00ed (p\u00e1rov\u00e1n\u00ed p\u0159es 5znakov\u00e9 kmeny slov)
    const pod = (k.podoblasti||[]).map((p, idx) => {
      const tokeny = bezDiakritiky(p.nazev + " " + p.rozhoduje).split(/[^a-z0-9]+/).filter(t => t.length > 3);
      const sedi = prelozene.some(w => tokeny.some(t => t.slice(0,5) === w.slice(0,5)));
      return sedi ? idx : -1;
    }).filter(x => x >= 0);
    return { k, skore, pod };
  }).filter(x => x.skore > 0).sort((a, b) => b.skore - a.skore);
}

// route = serializovatelná navigace (ukládá se do historie chatu)
function aplikujRoute(r){
  if(!r) return;
  if(r.duTab){ state.duTab = r.duTab; }
  if(r.duPopis){
    // předvyplní dual-use poradce popisem (např. z profilu firmy) a rovnou vyhodnotí
    const kb = KB();
    const s2 = { odpovedi:{}, kategorie:[], katOdpovedi:{}, pod:{}, prahy:{}, parametry:{}, popis:r.duPopis, analyzovano:true };
    const shody = duNajdiKategorie(r.duPopis, kb).filter(x=>x.skore>=2).slice(0,2);
    s2.kategorie = shody.map(x=>x.k.kod);
    shody.forEach(x=>{ if(x.pod.length) s2.pod[x.k.kod] = x.pod.slice(); });
    s2.rucne = !shody.length;
    state.duTest2 = s2;
  }
  if(r.domena){ state.du = { smer: "d2k", domena: r.domena, popis: (state.du||{}).popis || "" }; }
  if(r.prihlaskaProgram !== undefined){ state.prihlaskaProgram = r.prihlaskaProgram; }
  save();
  go(r.view, r.param);
}

  const docs = [];
  const typLabel = t("typ");
  kb.programy.forEach(p => docs.push({
    titul: p.nazev, stitek: typLabel[p.typ] || p.typ,
    text: [p.kratce, p.proKoho, p.castka, (p.jakFunguje||[]).join(" "), p.terminy, p.kdeKriteria, p.pomocDH, (p.vhodnyKdyz||[]).join(" ")].join(" "),
    ukazka: p.kratce, route: { view: "program", param: p.id }
  }));
  seznamVyzev(kb).forEach(v => docs.push({
    titul: v.nazev, stitek: state.lang === "en" ? "call" : "výzva",
    text: [v.pozn, v.stavRucne, v.uzaverka, v.program].join(" "),
    ukazka: (v.uzaverka ? (state.lang === "en" ? "deadline " : "uzávěrka ") + fmtDatum(v.uzaverka) + ". " : "") + (v.stavRucne || v.pozn || ""),
    route: { view: "vyzvy" }
  }));
  (kb.dualUseTest.rezimy||[]).forEach(r => docs.push({
    titul: r.nazev, stitek: state.lang === "en" ? "export/certification" : "export/certifikace",
    text: r.kdy + " " + r.akce, ukazka: r.akce,
    route: { view: "dualuse", duTab: "test" }
  }));
  kb.dualUseTest.kategorieAnnex.polozky.forEach(k => docs.push({
    titul: (state.lang === "en" ? "Annex I category " : "Kategorie přílohy I ") + k.kod + ": " + k.nazev,
    stitek: "dual-use", text: k.priklady.join(" "), ukazka: k.priklady.join("; "),
    route: { view: "dualuse", duTab: "test" }
  }));
  kb.dualUse.domeny.forEach(d => docs.push({
    titul: d.nazev, stitek: state.lang === "en" ? "use cases" : "use casy",
    text: d.defence.join(" ") + " " + d.komercni.map(x => x.sektor + " " + x.useCase).join(" "),
    ukazka: d.defence.slice(0,2).join("; ") + " ↔ " + d.komercni.slice(0,2).map(x=>x.sektor).join(", "),
    route: { view: "dualuse", duTab: "preklad", domena: d.id }
  }));
  // obsah webů programů (generuje denně GitHub Action z data/weby.csv)
  (((window.DH_WEBY || {}).polozky) || []).forEach(w => docs.push({
    titul: w.titul || w.url,
    stitek: state.lang === "en" ? (w.stitekEn || "website") : (w.stitekCs || "web"),
    text: w.text || "",
    ukazka: String(w.text || "").slice(0, 160) + (w.stazeno ? " (" + (state.lang === "en" ? "fetched " : "staženo ") + w.stazeno + ")" : ""),
    route: w.program ? { view: "program", param: w.program } : { view: "programy" }
  }));
  ((kb.ukrajina || {}).cesty || []).forEach(c => docs.push({
    titul: c.nazev, stitek: state.lang === "en" ? "Ukraine/testing" : "Ukrajina/testování",
    text: c.popis, ukazka: c.popis.slice(0, 160),
    route: c.program ? { view: "program", param: c.program } : { view: "programy" }
  }));
  kb.prihlaska.obecneKroky.forEach(k => docs.push({
    titul: k.krok, stitek: state.lang === "en" ? "application" : "přihláška",
    text: k.popis, ukazka: k.popis, route: { view: "prihlaska" }
  }));
  docs.push({
    titul: state.lang === "en" ? "Defence Hub contact and consultation" : "Kontakt a konzultace Defence Hubu",
    stitek: state.lang === "en" ? "contact" : "kontakt",
    text: (state.lang === "en" ? "help contact consultation team advise " : "pomoc kontakt konzultace tým poradí kdo pomůže ") + kb.meta.kontakt,
    ukazka: kb.meta.kontakt, route: { view: "programy" }
  });
  return docs;
}

function hledejKB(docs, dotaz){
  const slova = bezDiakritiky(dotaz).split(/[^a-z0-9]+/).filter(w => w.length > 2);
  if(!slova.length) return [];
  return docs.map(d => {
    const tb = bezDiakritiky(d.titul), xb = bezDiakritiky(d.text);
    let skore = 0;
    for(const w of slova){ if(tb.includes(w)) skore += 3; if(xb.includes(w)) skore += 1; }
    return { d, skore };
  }).filter(x => x.skore > 0).sort((a, b) => b.skore - a.skore).slice(0, 5);
}

function duNajdiDomenu(text, kb){
  const q = " " + bezDiakritiky(text) + " ";
  let nej = null, nejSkore = 0;
  kb.dualUse.domeny.forEach(d => {
    let s = 0;
    for(const syn of (DU_DOMENA_SYN[d.id]||[])){ if(q.includes(syn)) s += 3; }
    const txt = bezDiakritiky(d.nazev + " " + (d.defence||[]).join(" ") + " " + (d.komercni||[]).map(x=>x.sektor+" "+x.useCase).join(" "));
    for(const w of q.split(/[^a-z0-9]+/)){ if(w.length > 4 && txt.includes(w)) s += 1; }
    if(s > nejSkore){ nej = d.id; nejSkore = s; }
  });
  return nejSkore >= 2 ? nej : null;
}

// ---------- mini-poradce: ptací pole vložené do modulů (bez AI) ----------
// Stejný mozek jako chat v Poradci; historie se drží per záložka.
function vlozMiniPoradce(el, kb, klic, placeholder, kontextProgram){
  const docs = sestavIndexKB(kb);
  if(!state.miniHist) state.miniHist = {};
  const hist = state.miniHist[klic] = state.miniHist[klic] || [];
  const box = document.createElement("div");
  box.className = "card";
  box.innerHTML = `<div class="kicker" style="margin-bottom:6px">${esc(t("miniPoradce"))}</div>
    <div class="miniOkno cscroll" style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto"></div>
    <div style="display:flex;gap:9px;margin-top:8px">
      <input type="text" class="miniVstup" placeholder="${esc(placeholder)}" style="flex:1" maxlength="300">
      <button class="btn miniOdeslat" style="padding:9px 16px">${esc(t("porOdeslat"))}</button>
    </div>`;
  const okno = box.querySelector(".miniOkno");
  const vykresli = z => {
    if(z.role === "user"){
      okno.insertAdjacentHTML("beforeend", `<div style="align-self:flex-end;background:var(--blue);color:#fff;border-radius:12px 12px 3px 12px;padding:8px 12px;font-size:13px;max-width:85%">${esc(z.text)}</div>`);
      return;
    }
    const b = document.createElement("div");
    b.style.cssText = "align-self:flex-start;background:var(--mist);border-radius:12px 12px 12px 3px;padding:9px 12px;font-size:13px;max-width:92%;line-height:1.55";
    b.innerHTML = mdHtml(z.text);
    (z.tlacitka||[]).forEach(tl=>{
      if(!tl.route) return;
      const btn = document.createElement("button");
      btn.className = "btn ghost";
      btn.style.cssText = "padding:5px 11px;font-size:11.5px;background:#fff;margin:6px 6px 0 0";
      btn.textContent = tl.t;
      btn.onclick = ()=>aplikujRoute(tl.route);
      b.appendChild(btn);
    });
    okno.appendChild(b);
  };
  hist.forEach(vykresli);
  const vstup = box.querySelector(".miniVstup");
  const posli = ()=>{
    const q = vstup.value.trim();
    if(!q) return;
    vstup.value = "";
    if(kontextProgram) state.botKontext = kontextProgram;
    const r = botOdpoved(q, kb, docs);
    hist.push({ role:"user", text:q });
    hist.push({ role:"bot", text:r.text, tlacitka:(r.tlacitka||[]).filter(x=>x.route) });
    while(hist.length > 14) hist.shift();
    save();
    vykresli(hist[hist.length-2]); vykresli(hist[hist.length-1]);
    okno.scrollTop = okno.scrollHeight;
  };
  box.querySelector(".miniOdeslat").onclick = posli;
  vstup.addEventListener("keydown", e=>{ if(e.key === "Enter") posli(); });
  el.appendChild(box);
}

function botOdpoved(dotaz, kb, docs){

  const ma = (...slova) => slova.some(w => q.includes(w));
  const T = (cs, enTxt) => en ? enTxt : cs;

  const btnTest = { t: T("Spustit dual-use test", "Start the dual-use test"), route: { view: "dualuse", duTab: "test" } };
  const btnVyzvy = { t: T("Otevřít výzvy", "Open the calls"), route: { view: "vyzvy" } };
  const btnKontakt = kb.meta.kontakt;

  // programy zmíněné v dotazu
  // krátké aliasy jen jako celá slova (ať "edf" nechytá "předfinancování")
  const aliasy = botAliasyProgramu(kb);
  const nalezene = [...new Set(Object.keys(aliasy)
    .filter(a => a.length <= 4 ? q.includes(" " + a + " ") || q.includes(" " + a + "?") || q.includes(" " + a + ".") || q.includes(" " + a + ",") : q.includes(a))
    .map(a => aliasy[a]))];

  // 1) pozdrav / prázdno
  if(dotaz.trim().length < 3 || ma("ahoj","dobry den","zdravim","cau ","hello","hi ","hey")){
    return { text: T("Dobrý den! Jsem poradce Defence Hubu. Ptejte se na programy financování, aktuální výzvy, exportní kontrolu, certifikace nebo přípravu přihlášky – odpovídám přímo ze znalostní báze.",
      "Hello! I'm the Defence Hub advisor. Ask about funding programmes, open calls, export control, certifications or application prep – I answer straight from the knowledge base."),
      tlacitka: [btnVyzvy, btnPruvodce, btnTest] };
  }
  // 2) kontakt / konzultace – ale ne když se ptají na program nebo přihlášku
  if(!nalezene.length && !ma("prihlask","application") &&
     ma("kontakt","konzultac","poradte","pomoc","pomuzete","contact","consult","help us","who are you","kdo jste")){
    return { text: T("Nejrychlejší cesta: ", "The fastest way: ") + btnKontakt, tlacitka: [btnPruvodce] };

  // 2b) role žadatele: univerzita / výzkumná organizace

      T("Cesta univerzity k nim vede přes spin-off nebo partnerství s firmou – s obojím pomůže Defence Hub.", "A university's route to those is a spin-off or a partnership with a company – the Defence Hub helps with both."),
      tlacitka: [btnPruvodce, ...proUni.slice(0,2).map(p => ({ t: p.nazev.split(" –")[0].split(" (")[0], route: { view: "program", param: p.id } }))] };
  }
  // 2c0) „do jaké kategorie dual-use spadám?" – zatřídění podle přílohy I
  // Skóruje dotaz proti názvům, příkladům a podoblastem kategorií 0–9 z KB
  // (+ synonyma běžných výrazů, které v textu KB nejsou doslova).
  if(ma("kategori","categor","spadam","spadame","zatrid","zarazeni","zaradit") || (ma("dual") && ma("jaka","jake","jsem","jsme","which","what category"))){

        "\n\nNote: software and technology have no category of their own – each category has its own entries for them (D = software, E = technology), tied to that category's parameters. What matters is what the software does (encryption → 5, sensor data processing → 6, drone control → 7/9…).") : "";
    const zaver = aiPozn + T("\n\n⚠️ Přesné technické prahy definuje u každé položky příloha I nařízení 2021/821 – jestli je překračujete, ukáže dual-use test (semafor). Závazné zatřídění dělá Licenční správa MPO.",
      "\n\n⚠️ The exact technical thresholds are defined per item in Annex I of Regulation 2021/821 – whether you exceed them, the dual-use test shows (traffic light). Binding classification is done by the MPO Licensing Authority.");
    if(shody.length){
      const text = T("Podle popisu to zní na:", "From your description this sounds like:") + "\n\n" +
        shody.map(({k}) =>
          "**" + T("Kategorie ", "Category ") + k.kod + " – " + k.nazev + "**\n" +
          T("Patří sem např.: ", "Includes e.g.: ") + k.priklady.join("; ") + ".\n" +
          T("Rozhodující parametry:", "Deciding parameters:") + "\n" +
          (k.podoblasti||[]).map(p => "- " + p.nazev + " → " + p.rozhoduje).join("\n")
        ).join("\n\n") + zaver;
      return { text, tlacitka: [btnTest] };
    }
    return { text: T("Z tohohle popisu kategorii bohužel nepoznám – nechci hádat. Napište mi, co technicky děláte (např. „senzory“, „šifrování“, „drony“), nebo projděte dual-use test – provede vás všemi 10 kategoriemi přílohy I i vojenským seznamem.",
      "I can't tell the category from this description – I won't guess. Tell me what you technically do (e.g. “sensors”, “encryption”, “drones”), or take the dual-use test – it walks you through all 10 Annex I categories and the military list.") + zaver,
      tlacitka: [btnTest] };
  }
  // 2c) fazetové dotazy (kdy / kolik / pro koho / jak / kritéria) – k programu
  // z dotazu, nebo k naposledy zmíněnému programu (kontext konverzace)
  const facet =
    ma("kdy ","termin","uzaverk","deadline","when ") ? "terminy" :
    ma("kolik","castk","vyse podpory","amount","how much") ? "castka" :
    ma("pro koho","kdo muze","kdo se muze","who can","who is it for","zpusobil","eligib") ? "proKoho" :
    ma("jak funguje","jak to funguje","jak probiha","how does","how it works") ? "jakFunguje" :
    ma("kriteri","hodnoti","criteria","evaluat") ? "kdeKriteria" : null;
  const cilId = nalezene.length === 1 ? nalezene[0] : (!nalezene.length ? state.botKontext : null);
  if(facet && cilId){
    const p = kb.programy.find(x => x.id === cilId);
    if(p){
      state.botKontext = p.id;
      const btns = [{ t: t("detailBtn"), route: { view: "program", param: p.id } }];
      let text = "**" + p.nazev + "**\n";
      if(facet === "terminy"){
        text += "📅 " + p.terminy;
        const vy = aktivniVyzvy(kb, p.id).filter(x => x.s.rank < 4);
        if(vy.length) text += "\n" + vy.map(x => "- " + x.v.nazev + " — " + x.s.text).join("\n");
        btns.push(btnVyzvy);
      } else if(facet === "castka"){
        text += "💶 " + p.castka + (p.overit ? " _[" + (en ? "verify" : "ověřit") + "]_" : "");
      } else if(facet === "proKoho"){
        text += p.proKoho;
        if(p.jenPro) text += "\n" + T("Způsobilí žadatelé: ", "Eligible applicants: ") + p.jenPro.map(v => t("velikostL")[v] || v).join(", ") + ".";
      } else if(facet === "jakFunguje"){
        text += (p.jakFunguje || []).map(x => "- " + x).join("\n");
      } else {
        text += "📋 " + (p.kdeKriteria || p.terminy);
      }
      return { text, tlacitka: btns };
    }
  }
  // 3) konkrétní program(y)
  if(nalezene.length === 1){
    const p = kb.programy.find(x => x.id === nalezene[0]);
    state.botKontext = p.id;
    return { text: botProgramText(p, en) + (p.kdeKriteria ? "\n\n📋 " + p.kdeKriteria : ""),
      tlacitka: [
        { t: t("detailBtn"), route: { view: "program", param: p.id } },
        { t: t("prihlaskaBtn"), route: { view: "prihlaska", prihlaskaProgram: p.id } }
      ] };
  }
  if(nalezene.length > 1){
    return { text: T("Týká se to několika programů – který vás zajímá?", "That touches several programmes – which one do you mean?"),
      tlacitka: nalezene.slice(0,4).map(id => { const p = kb.programy.find(x=>x.id===id); return { t: p.nazev, route: { view: "program", param: id } }; }) };
  }
  // 3b) „jaký program se mi hodí / kam se přihlásit?" → průvodce
  if(ma("jaky program","ktery program","kam se prihlasit","kam se mam","kam mam","se mi hodi","se nam hodi","doporuc","co mame delat","co mam delat","which programme","which program","recommend","where to apply","what should")){
    return { text: T("Na tohle je nejlepší průvodce: 5 otázek (zaměření, TRL, forma podpory, konsorcium, kdo jste) a ukáže jen programy, které pro vás dávají smysl – ostatní rovnou skryje. Můžete se pak doptat na detaily tady v chatu.",
      "The wizard is best for this: 5 questions (focus, TRL, form of support, consortium, who you are) and it shows only the programmes that make sense for you – the rest is hidden. You can then ask me for details here."),
      tlacitka: [btnPruvodce, btnVyzvy] };
  }
  // 4) výzvy / termíny
  if(ma("vyzv","uzaverk","termin","deadline","calls","otevren","open call","bezi","aktualni")){
    const akt = aktivniVyzvy(kb).filter(x => x.s.rank < 3).slice(0, 5);
    return { text: T("Aktuální výzvy podle znalostní báze:", "Current calls per the knowledge base:") + "\n" +
      akt.map(x => "- **" + x.v.nazev + "** — " + x.s.text).join("\n"),
      tlacitka: [btnVyzvy] };
  }
  // 5) investice / equity
  if(ma("invest","equity","podil","venture"," vc ","fond")){
    const inv = kb.programy.filter(p => (p.typ === "equity" || p.typ === "mix") && !p.jenInfo).slice(0, 3);
    return { text: T("Pro investici (výměnou za podíl) jsou hlavní cesty:", "For investment (in exchange for equity) the main routes are:") + "\n" +
      inv.map(p => "- **" + p.nazev + "** — " + p.castka).join("\n"),
      tlacitka: inv.map(p => ({ t: p.nazev, route: { view: "program", param: p.id } })) };
  }
  // 6) šifrování (dřív než obecný export)
  if(ma("sifr","krypt","encrypt")){
    const kat5 = kb.dualUseTest.kategorieAnnex.polozky.find(k => k.kod === "5");
    return { text: T("Šifrování patří do kategorie 5 přílohy I (typicky položka 5A002): ", "Encryption falls under Annex I category 5 (typically entry 5A002): ") +
      kat5.priklady.join("; ") + ".\n\n" + T("Jestli překračujete kontrolované parametry, zjistíte v dual-use testu.", "Whether you exceed the controlled parameters – find out in the dual-use test."),
      tlacitka: [btnTest] };
  }
  // 7) ITAR / americké komponenty
  if(ma("itar"," ear ","americk","us komponent","reexport")){
    const rez = kb.dualUseTest.rezimy.find(r => r.id === "itar");
    return { text: "**" + rez.nazev + "**\n" + rez.kdy + ".\n\n" + rez.akce, tlacitka: [btnTest] };
  }
  // 8) prověrky / utajení
  if(ma("prover","utajen"," nbu ","clearance","classified")){
    const rez = kb.dualUseTest.rezimy.find(r => r.id === "nbu");
    return { text: "**" + rez.nazev + "**\n" + rez.kdy + ".\n\n" + rez.akce, tlacitka: [btnTest] };
  }
  // 9) certifikace / NATO řetězec
  if(ma("certifik","ncage","nspa","aqap","stanag","kodifik","as9100"," iso ","nsn","dodavatel")){
    const rez = kb.dualUseTest.rezimy.find(r => r.id === "nato-retezec");
    return { text: "**" + rez.nazev + "**\n" + rez.akce, tlacitka: [btnTest] };
  }
  // 10) dual-use / export obecně
  if(ma("dual","zatrid","export","vyvoz","licenc","klasifikac","classif","kontrolni seznam","vojensky material")){
    return { text: T("Zatřídění se dělá podle dvou kontrolních seznamů – Společného vojenského seznamu EU a přílohy I nařízení 2021/821. Nejrychleji to zjistíte v dual-use testu: provede vás oběma seznamy a řekne, co ověřit dál (vždy s tím, že závazné zatřídění dělá Licenční správa MPO).",
      "Classification follows two control lists – the EU Common Military List and Annex I of Regulation 2021/821. The fastest way is the dual-use test: it walks you through both lists and tells you what to verify next (binding classification is always for the MPO Licensing Authority)."),
      tlacitka: [btnTest, { t: T("Dual-use překladač", "Dual-use translator"), route: { view: "dualuse", duTab: "preklad" } }] };
  }
  // 11) konsorcium / partneři
  if(ma("konsorci","partner","consorti")){
    return { text: T("Konsorcium vyžadují EDF (min. 3 subjekty ze 3 zemí) a Horizont; EUDIS Open Call 3 firmy ze 3 států. Sami žádáte u DIANA, EIC, PRODEF nebo OP TAK. S hledáním partnerů pomáhá Defence Hub (matchmaking) a EUDIS eventy.",
      "EDF requires a consortium (min. 3 entities from 3 countries), as does Horizon; the EUDIS Open Call needs 3 companies from 3 states. You apply alone to DIANA, EIC, PRODEF or OP TAK. The Defence Hub helps with partner search (matchmaking), as do EUDIS events."),
      tlacitka: [{ t: "EDF", route: { view: "program", param: "edf" } }, { t: "EUDIS", route: { view: "program", param: "eudis" } }, btnPruvodce] };
  }
  // 11b) délka hodnocení / vyplácení – ověřená čísla v KB nejsou, nelhat
  if(ma("jak dlouho","how long","doba hodnoceni","doba schval","kdy dostanu penize","kdy prijdou penize")){
    return { text: T("Délka hodnocení se u každého programu liší a ověřená čísla ve znalostní bázi zatím nemám – nebudu je odhadovat. Orientační průběh najdete v detailu programu (sekce Jak to funguje), závazné lhůty v dokumentaci konkrétní výzvy. S časováním pomůže i tým: ",
      "Evaluation timelines differ per programme and I don't have verified figures in the knowledge base – I won't guess. See the programme detail (How it works) for the rough flow and the call documentation for binding deadlines. The team can help with timing too: ") + btnKontakt,
      tlacitka: [btnVyzvy, btnPruvodce] };
  }
  // 12) přihláška
  if(ma("prihlask","zadost","napsat","application","apply","proposal","podat")){
    const kroky = kb.prihlaska.obecneKroky.slice(0, 3);
    return { text: T("Základ dobré žádosti:", "The basics of a good application:") + "\n" +
      kroky.map((k, i) => (i+1) + ". **" + k.krok + "** – " + k.popis).join("\n") + "\n…",
      tlacitka: [{ t: t("nav").prihlaska, route: { view: "prihlaska" } }] };
  }
  // 13) TRL
  if(ma(" trl")){
    return { text: T("TRL (Technology Readiness Level) je stupnice zralosti technologie 1–9: 1–3 výzkum, 4–6 prototyp, 7–9 produkt. Programy cílí na různá pásma – průvodce vám podle TRL doporučí ty správné.",
      "TRL (Technology Readiness Level) is a 1–9 maturity scale: 1–3 research, 4–6 prototype, 7–9 product. Programmes target different bands – the wizard recommends the right ones for your TRL."),
      tlacitka: [btnPruvodce] };
  }
  // 14) Ukrajina / testování – skládá se z KB sekce ukrajina
  if(ma("ukrajin","ukrain","brave","testov","testing","otestova","bojist","battlefield","polygon")){
    if(kb.ukrajina){
      return {
        text: "**" + T("Testování a cesty přes Ukrajinu", "Testing and routes via Ukraine") + "**\n" +
          kb.ukrajina.uvod + "\n\n" + kb.ukrajina.akce + "\n\n" + kb.ukrajina.overeno,
        karty: kb.ukrajina.cesty.map(c => ({
          titul: c.nazev, stitek: T("Ukrajina/testování", "Ukraine/testing"),
          ukazka: c.popis.slice(0, 160),
          route: c.program ? { view: "program", param: c.program } : { view: "programy" }
        })),
        tlacitka: [{ t: "EUDIS", route: { view: "program", param: "eudis" } }, { t: "EDIP", route: { view: "program", param: "edip" } }]
      };
    }
    return { text: T("Cesty přes Ukrajinu: EUDIS Accelerator nabízí Test in Ukraine, EDIP zahrnuje program BraveTech EU (50 mil. € EU + 50 mil. € Ukrajina) a platforma BRAVE1 propojuje s ukrajinským defense-tech ekosystémem.",
      "Ukraine routes: the EUDIS Accelerator offers Test in Ukraine, EDIP includes BraveTech EU (€50m EU + €50m Ukraine), and the BRAVE1 platform connects to the Ukrainian defense-tech ecosystem."),
      tlacitka: [{ t: "EUDIS", route: { view: "program", param: "eudis" } }, { t: "EDIP", route: { view: "program", param: "edip" } }] };
  }
  // 15) granty / peníze obecně
  if(ma("grant","penize","financ","dotac","fund","money","kolik","podpor")){
    return { text: T("Non-dilutive granty (peníze bez odevzdání podílu) nabízí hlavně DIANA, EDF/EUDIS, grantová část EIC, PRODEF a OP TAK. Který sedí právě vám, zjistí průvodce z 5 otázek (zaměření, TRL, konsorcium…).",
      "Non-dilutive grants come mainly from DIANA, EDF/EUDIS, the EIC grant component, PRODEF and OP TAK. The 5-question wizard tells you which fits you (focus, TRL, consortium…)."),
      tlacitka: [btnPruvodce, btnVyzvy] };
  }
  // 16) fallback: odpověď textem z nejbližšího místa KB + související karty.
  // Slabá shoda (skóre < 4) není odpověď – to radši přiznat, že nevíme,
  // a nabídnout související témata jen jako karty.
  const vysledky = hledejKB(docs, dotaz);
  if(vysledky.length && vysledky[0].skore >= 4){
    const top = vysledky[0].d;
    if(top.route && top.route.view === "program") state.botKontext = top.route.param;
    return {
      text: T("Ze znalostní báze:", "From the knowledge base:") + "\n**" + top.titul + "**\n" +
        String(top.ukazka || top.text || "").slice(0, 300),
      tlacitka: top.route ? [{ t: t("liteOtevrit"), route: top.route }] : [],
      karty: vysledky.slice(1, 4).map(({d}) => ({ titul: d.titul, stitek: d.stitek, ukazka: String(d.ukazka||"").slice(0,160), route: d.route }))
    };
  }
  if(vysledky.length){
    return {
      text: T("Na tohle přímou odpověď ve znalostní bázi nemám – nechci si vymýšlet. Zkuste otázku položit jinak (např. s názvem programu nebo technologie), nebo se obraťte na tým: ",
        "I don't have a direct answer to this in the knowledge base – I won't make one up. Try rephrasing (e.g. with a programme or technology name), or ask the team: ") + btnKontakt,
      tlacitka: [btnPruvodce, btnTest],
      karty: vysledky.slice(0, 3).map(({d}) => ({ titul: d.titul, stitek: d.stitek, ukazka: String(d.ukazka||"").slice(0,160), route: d.route }))
    };
  }
  return { text: t("liteNic"), tlacitka: [btnPruvodce] };
}

function renderLite(el, kb){
  const docs = sestavIndexKB(kb);
  if(!state.liteHist) state.liteHist = [];
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div id="botOkno" class="cscroll" style="max-height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:6px"></div>
    <div style="display:flex;gap:9px;margin-top:10px">
      <input type="text" id="botVstup" placeholder="${esc(t("litePlaceholder"))}" style="flex:1" maxlength="300">
      <button class="btn" id="botOdeslat">${esc(t("porOdeslat"))}</button>
    </div>
    <div style="margin-top:10px">
      ${[t("liteChip1"),t("liteChip2"),t("liteChip3"),t("liteChip4")].map(ch=>`<span class="chip lite-chip">${esc(ch)}</span>`).join("")}
      ${state.liteHist.length?`<span class="chip" id="botNovy">${esc(t("porNovy"))}</span>`:""}
    </div>`;
  el.appendChild(card);

  const okno = card.querySelector("#botOkno");
  function bublina(z){
    if(z.role === "user"){
      okno.insertAdjacentHTML("beforeend",
        `<div style="align-self:flex-end;max-width:85%;background:var(--blue);color:#fff;border-radius:13px 13px 3px 13px;padding:9px 13px;font-size:13.5px;line-height:1.5;white-space:pre-wrap">${esc(z.text)}</div>`);
      return;
    }
    const b = document.createElement("div");
    b.style.cssText = "align-self:flex-start;max-width:92%;background:var(--mist);border-radius:13px 13px 13px 3px;padding:10px 13px;font-size:13.5px;line-height:1.55";
    b.innerHTML = mdHtml(z.text);
    (z.karty || []).forEach(k => {
      const kdiv = document.createElement("div");
      kdiv.style.cssText = "background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:8px;cursor:pointer";
      kdiv.innerHTML = `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><strong style="font-size:13px;flex:1;min-width:150px">${esc(k.titul)}</strong><span class="tag" style="background:var(--blueSoft);color:var(--blue)">${esc(k.stitek)}</span></div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px">${esc(k.ukazka)}</div>`;
      kdiv.onclick = () => aplikujRoute(k.route);
      b.appendChild(kdiv);
    });
    if(z.tlacitka && z.tlacitka.length){
      const rada = document.createElement("div");
      rada.style.cssText = "display:flex;gap:7px;flex-wrap:wrap;margin-top:9px";
      z.tlacitka.forEach(tl => {
        const btn = document.createElement("button");
        btn.className = "btn ghost";
        btn.style.cssText = "padding:6px 12px;font-size:12px;background:#fff";
        btn.textContent = tl.t;
        btn.onclick = () => aplikujRoute(tl.route);
        rada.appendChild(btn);
      });
      b.appendChild(rada);
    }
    okno.appendChild(b);
  }
  if(!state.liteHist.length){
    bublina({ role: "bot", ...botOdpoved("", kb, docs) }); // uvítání (neukládá se)
  } else {
    state.liteHist.forEach(bublina);
  }
  okno.scrollTop = okno.scrollHeight;

  const vstup = card.querySelector("#botVstup");
  function odesli(text){
    text = (text || "").trim();
    if(!text) return;
    vstup.value = "";
    const u = { role: "user", text };
    const b = { role: "bot", ...botOdpoved(text, kb, docs) };
    state.liteHist.push(u, b);
    if(state.liteHist.length > 30) state.liteHist = state.liteHist.slice(-30);
    save();
    bublina(u); bublina(b);
    okno.scrollTop = okno.scrollHeight;
  }
  card.querySelector("#botOdeslat").onclick = () => odesli(vstup.value);
  vstup.addEventListener("keydown", e => { if(e.key === "Enter") odesli(vstup.value); });
  card.querySelectorAll(".lite-chip").forEach(ch => ch.onclick = () => odesli(ch.textContent));
  const novy = card.querySelector("#botNovy");
  if(novy) novy.onclick = () => { state.liteHist = []; save(); go("poradce"); };
}

}
