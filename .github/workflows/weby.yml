name: Aktualizace obsahu webů (DH Kompas)

on:
  schedule:
    - cron: "30 5 * * *"   # denně 05:30 UTC (po aktualizaci výzev)
  workflow_dispatch: {}     # tlačítko "Run workflow" v záložce Actions
  push:
    paths:
      - "data/weby.csv"     # a při každé úpravě seznamu webů

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stáhnout weby a vygenerovat navigator/weby.js
        run: node scripts/update-weby.js
      - name: Commit při změně
        run: |
          if ! git diff --quiet navigator/weby.js 2>/dev/null || [ -n "$(git status --porcelain navigator/weby.js)" ]; then
            git config user.name "dh-kompas-bot"
            git config user.email "actions@users.noreply.github.com"
            git add navigator/weby.js
            git commit -m "Automatická aktualizace obsahu webů"
            git push
          else
            echo "Weby beze změny."
          fi
