name: Aktualizace výzev (DH Kompas)

on:
  schedule:
    - cron: "0 5 * * *"   # denně 05:00 UTC
  workflow_dispatch: {}    # tlačítko "Run workflow" v záložce Actions
  push:
    paths:
      - "data/vyzvy.csv"   # a při každé úpravě CSV v repu

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vygenerovat navigator/vyzvy.js
        run: node scripts/update-vyzvy.js
        env:
          VYZVY_CSV_URL: ${{ vars.VYZVY_CSV_URL }}
      - name: Commit při změně
        run: |
          if ! git diff --quiet navigator/vyzvy.js; then
            git config user.name "dh-kompas-bot"
            git config user.email "actions@users.noreply.github.com"
            git add navigator/vyzvy.js
            git commit -m "Automatická aktualizace výzev"
            git push
          else
            echo "Výzvy beze změny."
          fi
