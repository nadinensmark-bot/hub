name: Kontrola backendu (DH Kompas)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Adresa backendu"
        required: false
        default: "https://dh-kompas-backend.onrender.com"
      test_lead:
        description: "Poslat testovací kontakt (ano/ne) – ověří cestu server → Google tabulka"
        required: false
        default: "ne"

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/health (s trpělivostí na studený start free plánu)
        run: |
          URL="${{ github.event.inputs.url || 'https://dh-kompas-backend.onrender.com' }}/api/health"
          echo "Kontroluji: $URL"
          for i in 1 2 3 4 5 6; do
            ODP=$(curl -sS --max-time 90 "$URL" || true)
            echo "Pokus $i: $ODP"
            if echo "$ODP" | grep -q '"ok":true'; then
              echo "✅ Backend běží."
              exit 0
            fi
            sleep 15
          done
          echo "❌ Backend neodpověděl {\"ok\":true}."
          exit 1
      - name: Testovací lead (ověření cesty do Google tabulky)
        if: ${{ github.event.inputs.test_lead == 'ano' }}
        run: |
          URL="${{ github.event.inputs.url || 'https://dh-kompas-backend.onrender.com' }}/api/lead"
          ODP=$(curl -sS --max-time 90 -X POST "$URL" -H 'Content-Type: application/json' \
            -d '{"firma":"TEST – kontrolní workflow","email":"test@dhkompas.test","profil":"Testovací záznam – smazat","souhlas":true,"lang":"cs"}')
          echo "Odpověď: $ODP"
          echo "$ODP" | grep -q '"ok":true' && echo "✅ Server lead přijal. Zkontrolujte řádek TEST v Google tabulce – pokud tam není, chybí/nesedí LEADS_WEBHOOK_URL v Renderu." || exit 1
