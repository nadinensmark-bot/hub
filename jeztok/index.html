<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Ježtok – učení, co se scrolluje</title>
  <meta name="description" content="Ježtok: feed jako TikTok, ale místo kravin učivo z kurzů a do školy. Hudba, ježek, opakování v rozestupech, testy.">
  <meta name="theme-color" content="#0b0b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ježtok">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/ikona.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/ikona-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="ve-feedu">
  <div id="app">
    <header class="hlava">
      <div class="logo"><span id="jezek-hlava"></span>Ježtok</div>
      <div class="chipy"><span class="chip" id="chip-streak">🔥 0</span><span class="chip" id="chip-xp">⚡ 0</span></div>
    </header>

    <main id="feed" class="obrazovka akt" aria-label="feed"></main>
    <section id="testy" class="obrazovka"></section>
    <section id="kurzy" class="obrazovka"></section>
    <section id="ja" class="obrazovka"></section>

    <div id="jezek-bublina"></div>
    <div id="toast" role="status"></div>
    <div id="sheet"></div>

    <div class="hudba">
      <div id="hudba-disk"></div>
      <div id="hudba-nazev">☕ Lo-fi klid · ťukni pro hudbu</div>
      <button id="hudba-btn" aria-label="přehrát / pozastavit">▶</button>
    </div>
    <nav class="nav">
      <button data-o="feed" class="akt"><span>🏠</span>Feed</button>
      <button data-o="testy"><span>📝</span>Testy</button>
      <button data-o="kurzy"><span>📚</span>Kurzy</button>
      <button data-o="ja"><span>🦔</span>Já</button>
    </nav>
  </div>
  <canvas id="konfety"></canvas>

  <script>window.JEZTOK_VERZE = "0.1.0";</script>
  <script src="config.js"></script>
  <!-- OBSAH: každý kurz = jeden soubor. Nový kurz přidej sem (nebo v appce jako JSON). -->
  <script src="obsah/kurz-uceni.js"></script>
  <script src="obsah/kurz-finance.js"></script>
  <script src="obsah/kurz-anglictina.js"></script>
  <!-- aplikace -->
  <script src="js/slouceni.js"></script>
  <script src="js/jezek.js"></script>
  <script src="js/hudba.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
