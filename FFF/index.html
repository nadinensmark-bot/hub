*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-head);font-weight:600;text-wrap:balance;margin:0}
a{color:var(--blue-700)}
button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:11px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .co{height:30px;width:170px;background:var(--logo) left center/contain no-repeat}
.brand .dia{height:30px;width:95px;background:var(--diana) left center/contain no-repeat;opacity:.9;border-left:1px solid var(--line);padding-left:14px}
.spacer{flex:1 1 auto}
.ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(11,21,48,.12)}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:15px;display:inline-grid;place-items:center}
.iconbtn:hover{color:var(--fg);border-color:var(--blue)}

/* heading */
.head{padding-block:22px 10px}
.eyebrow{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--blue-700);font-weight:600}
.head h1{font-size:clamp(26px,4.4vw,38px);margin:8px 0 4px;letter-spacing:-.01em}
.head .sub{color:var(--muted);font-size:15px;max-width:60ch}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-head);font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

/* board */
.board{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start;padding-bottom:30px}
@media (max-width:860px){.board{grid-template-columns:1fr}}

.plan-card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.plan-card{padding:16px}
.plan-cap{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 12px}
.plan-cap h2{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.plan-cap .hint{font-size:12px;color:var(--faint)}

/* realistic floor plan (SVG) */
.plan-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:10px}
.plan-svg{display:block;width:100%;min-width:640px;height:auto}
.campus{fill:var(--inset);stroke:var(--line);stroke-width:1.5}
.region{cursor:pointer}
.region rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:fill .14s,stroke .14s}
.region:hover rect{fill:var(--blue-soft);stroke:var(--blue)}
.region:focus{outline:none}
.region:focus-visible rect{stroke:var(--blue);stroke-width:2.6}
.region[aria-pressed="true"] rect{fill:var(--sel);stroke:var(--sel)}
.region.dim{opacity:.4}
.region.dim rect{stroke-dasharray:3 3}
.region .rc{font:700 17px var(--f-head);fill:var(--fg)}
.region .rn{font:500 10.5px var(--f-body);fill:var(--muted)}
.region .rct{font:600 10.5px var(--f-body);fill:var(--blue-700)}
.region[aria-pressed="true"] .rc,.region[aria-pressed="true"] .rn,.region[aria-pressed="true"] .rct{fill:#fff}
.region .dpin{fill:var(--green)}
.region[aria-pressed="true"] .dpin{fill:#fff}
.region .dbpin{font:700 11px var(--f-head);fill:var(--green)}
.region[aria-pressed="true"] .dbpin{fill:#fff}
.ctx rect{fill:var(--inset);stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 3}
.ctx .cl{font:600 10px var(--f-body);fill:var(--faint)}
.ctx .cl.b{font-weight:700;fill:var(--muted)}
.door circle{fill:var(--surface);stroke:#cf4a4a;stroke-width:1.6}
.door text{font:700 10px var(--f-head);fill:#cf4a4a}
.mk.pri circle{fill:var(--green);stroke:none}
.mk.vip circle{fill:#cf4a4a;stroke:none}
.pll{font:600 9px var(--f-body);fill:var(--faint);letter-spacing:.03em}

/* panel */
.panel{padding:16px;min-height:360px;display:flex;flex-direction:column;gap:12px}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--inset);color:var(--fg);border-radius:10px;
  padding:11px 12px 11px 36px;font-size:14px;font-family:inherit}
.search input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.panel-head h2{font-size:19px}
.panel-head .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel-note{font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;overflow-y:auto;max-height:52vh;display:flex;flex-direction:column;gap:7px;min-width:0}
.list::-webkit-scrollbar{width:9px}.list::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.firm{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface-2);min-width:0}

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// no single-letter CZ prepositions/conjunctions at line end: glue them to next word with NBSP
function nb(s){return state.lang==='cz'?String(s).replace(/(^|[\s(„"])([zksvouaiKZSVOUAI])\s/g,'$1$2 '):String(s);}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}}

const DIANAHALL="H5";
function regionSVG(h,x,y,w,hh){
  const firms=IDX[h]||[],cur=curByHall(),dbf=(cur?cur[h]:[])||[];
  const curated=state.mode==='db'||state.mode==='dia';
  const dim=curated&&dbf.length===0, pressed=state.sel===h;
  const count=curated?dbf.length:firms.length;
  const unit=state.mode==='db'?(state.lang==='cz'?'naše':'ours'):state.mode==='dia'?'DIANA':(state.lang==='cz'?'firem':'firms');
  const ctxt=(curated&&!dbf.length)?'0':(count+' '+unit);
  const nm=esc(nb(SHORT[h][state.lang]));
  const cls='region'+(dim?' dim':'')+(h===DIANAHALL?' diana':'');
  let g='<g class="'+cls+'" data-hall="'+h+'" role="button" tabindex="'+(dim?-1:0)+'" aria-pressed="'+pressed+'" aria-label="'+esc(h+' '+SHORT[h][state.lang]+', '+ctxt)+'">';
  g+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="8"/>';
  if(hh>=76){
    g+='<text class="rc" x="'+(x+11)+'" y="'+(y+26)+'">'+h+'</text>';
    g+='<text class="rn" x="'+(x+11)+'" y="'+(y+42)+'">'+nm+'</text>';
    g+='<text class="rct" x="'+(x+11)+'" y="'+(y+hh-11)+'">'+ctxt+'</text>';
  }else{
    const cy=y+hh/2;
    if(h==='OTHER'){
      g+='<text class="rn" x="'+(x+11)+'" y="'+(cy+5)+'">'+nm+' · '+ctxt+'</text>';
    }else{
      g+='<text class="rc" x="'+(x+11)+'" y="'+(cy+6)+'">'+h+'</text>';
      g+='<text class="rn" x="'+(x+48)+'" y="'+(cy+5)+'">'+nm+' · '+ctxt+'</text>';
    }
  }
  if(h===DIANAHALL&&state.mode==='all') g+='<circle class="dpin" cx="'+(x+w-15)+'" cy="'+(y+16)+'" r="5"/>';
  if(curated&&dbf.length) g+='<text class="dbpin" x="'+(x+w-10)+'" y="'+(y+21)+'" text-anchor="end">'+dbf.length+'×</text>';
  g+='</g>'; return g;
}

function renderPanel(){

  if(state.mode==='program'){ return renderProgramPanel(); }
  if(state.q){ return renderSearch(); }

    const h=state.sel;
    const nm = HALLS[h]?HALLS[h].nm[state.lang]:(SUBMETA[h]?SUBMETA[h].nm[state.lang]:h);

    const count = (state.mode==='db'||state.mode==='dia')?(curByHall()[h]||[]).length:(IDX[h]||[]).length;

      '<span class="meta">'+count+' '+esc(label)+'</span></div>'+
      '<ul class="list">'+(hallFirmsHTML(h)||'<div class="empty">'+(state.lang==='cz'?'Žádné firmy.':'No firms.')+'</div>')+'</ul>';
    return;
  }
  // default
  if(state.mode==='db'||state.mode==='dia'){
    const heading=state.mode==='db'?t.allDbHeading:t.allDiaHeading;

    body.innerHTML=html;
  }else{
    let order=["H1","H2","H3","H4","H5","H2D","H8","OA","OTHER"];
    let leg=order.map(h=>{
      const nm=HALLS[h]?HALLS[h].nm[state.lang]:SUBMETA[h].nm[state.lang];
      const code=h==='OTHER'?(state.lang==='cz'?'Ostatní':'Other'):h;
      return '<button data-hall="'+h+'"><span><span class="lc">'+esc(code)+'</span> <span class="ln">'+esc(nb(nm))+'</span></span><span class="lv">'+(IDX[h]||[]).length+'</span></button>';
    }).join('');
    body.innerHTML='<div class="panel-head"><h2>'+esc(t.pick)+'</h2></div><p class="panel-note">'+esc(nb(t.pickNote))+'</p><div class="legend">'+leg+'</div>';
    body.querySelectorAll('.legend button').forEach(b=>b.onclick=()=>select(b.dataset.hall));
  }
}
function renderSearch(){
  const t=T[state.lang], body=$("panelBody"), q=state.q.toLowerCase();
  let pool = (state.mode==='db'||state.mode==='dia')
     ? curSet().map(f=>({n:f.n,h:f.hall,s:f.stand,w:'',db:f}))
     : FFF;
  let res=pool.filter(f=>f.n.toLowerCase().includes(q)||(f.s||'').toLowerCase().includes(q)).slice(0,80);
  let items=res.map(f=> (state.mode==='db'||state.mode==='dia')?firmCardCur(f.db):firmCard(f)).join('');
  body.innerHTML='<div class="panel-head"><h2>'+esc(t.results)+'</h2><span class="meta">'+res.length+'</span></div>'+
    '<ul class="list">'+(items||'<div class="empty">'+esc(t.noRes)+'</div>')+'</ul>';
}

function updateStats(){
  const t=T[state.lang];
  const curated=state.mode==='db'||state.mode==='dia';
  const totalExh = curated?curSet().length:FFF.length;
  const hallsUsed = curated?new Set(curSet().map(f=>f.hall)).size:new Set(FFF.flatMap(f=>f.H)).size;
  $("sExh").textContent=totalExh; $("sExhL").textContent=curated?t.sFirmsL:t.sExhL;
  $("sHalls").textContent=hallsUsed; $("sHallsL").textContent=t.sHallsL;
  if(state.sel){
    const c=curated?(curByHall()[state.sel]||[]).length:(IDX[state.sel]||[]).length;
    $("sSel").textContent=c;
  }else $("sSel").textContent="0";
  $("sSelL").textContent=curated?(state.mode==='db'?t.sSelDbL:t.sSelDiaL):t.sSelL;
}

function applyText(){
  const t=T[state.lang];
  const isP=state.mode==='program';
  const P=(a,db,dia)=>state.mode==='all'?a:state.mode==='db'?db:dia;
  $("mAll").textContent=t.mAll+" ("+FFF.length+")";
  $("mDia").textContent=t.mDia+" ("+DIANA15.length+")";
  $("mDb").textContent=t.mDb+" ("+DB12.length+")";
  $("mProg").textContent=t.mProg;
  $("dblink").textContent=t.dbLinkLabel;
  $("eyebrow").textContent=nb(isP?t.eyebrowProg:P(t.eyebrowAll,t.eyebrowDb,t.eyebrowDia));
  $("title").textContent=nb(isP?t.titleProg:P(t.titleAll,t.titleDb,t.titleDia));
  $("subtitle").textContent=nb(isP?t.subProg:P(t.subAll,t.subDb,t.subDia));
  $("planCap").textContent=nb(t.planCap);
  $("planHint").textContent=t.planHint;
  $("q").placeholder=t.qph;
  $("src").textContent=nb(isP?t.srcProg:P(t.srcAll,t.srcDb,t.srcDia));
  $("cta").textContent=t.cta;
}

function select(h){ state.sel=(state.sel===h?null:h); state.q=''; $("q").value=''; renderAll(); }

function renderProgramPanel(){
  const t=T[state.lang], L=state.lang, body=$("panelBody");
  const tabs=DAYS.map(d=>'<button class="pdtab'+(state.pday===d.k?' on':'')+'" data-pday="'+d.k+'">'+esc(d[L])+'</button>').join('');
  const rows=(PROG_DAYS[state.pday]||[]).map(x=>{
    const tag=TAGS[x.tag]?TAGS[x.tag][L]:x.tag;
    return '<li class="psession"><div class="ptime">'+esc(x.t)+'</div>'+
      '<div class="pbody"><span class="ptag">'+esc(tag)+'</span>'+
      '<div class="ptitle">'+esc(x.title)+'</div>'+
      '<div class="pplace">'+esc(x.place)+'</div>'+
      (x.note?'<div class="pnote">'+esc(nb(x.note))+'</div>':'')+'</div></li>';
  }).join('');
  body.innerHTML='<div class="phead"><div><div class="pday">'+esc(t.progHeading)+'</div>'+
    '<div class="pdaysub">'+esc(nb(t.progDaySub))+'</div></div>'+
    '<a class="pfull" href="https://www.fff.global/en/#programme" target="_blank" rel="noopener">'+esc(t.progFull)+' ↗</a></div>'+
    '<div class="pdtabs">'+tabs+'</div><ul class="plist">'+rows+'</ul>';
  body.querySelectorAll('.pdtab').forEach(b=>b.onclick=()=>{state.pday=b.dataset.pday;renderProgramPanel();});
}
function renderAll(){
  applyText();
  const prog = state.mode==='program';
  document.getElementById('statsRow').hidden=prog;
  document.getElementById('searchWrap').hidden=prog;
  buildPlan();
  renderPanel();
  if(!prog) updateStats();
}

// controls
$("mAll").onclick=()=>{state.mode='all';state.sel=null;state.q='';$("q").value='';setPressed();renderAll();};
$("mDia").onclick=()=>{state.mode='dia';state.sel=null;state.q='';$("q").value='';setPressed();renderAll();};
$("mDb").onclick=()=>{state.mode='db';state.sel=null;state.q='';$("q").value='';setPressed();renderAll();};
$("mProg").onclick=()=>{state.mode='program';state.sel=null;state.q='';$("q").value='';setPressed();renderAll();};
$("lCz").onclick=()=>{state.lang='cz';setPressed();renderAll();};
$("lEn").onclick=()=>{state.lang='en';setPressed();renderAll();};
function setPressed(){
  $("mAll").setAttribute('aria-pressed',state.mode==='all');
  $("mDia").setAttribute('aria-pressed',state.mode==='dia');
  $("mDb").setAttribute('aria-pressed',state.mode==='db');
  $("mProg").setAttribute('aria-pressed',state.mode==='program');
  $("lCz").setAttribute('aria-pressed',state.lang==='cz');
  $("lEn").setAttribute('aria-pressed',state.lang==='en');
}
let qt; $("q").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim();if(state.q)state.sel=null;renderPanel();},120);};
// theme toggle
(function(){let cur=null;try{cur=localStorage.getItem('fffth')}catch(e){}
 document.documentElement.setAttribute('data-theme',cur||'light');
 $("theme").onclick=()=>{const d=document.documentElement;
   let now=d.getAttribute('data-theme');
   if(!now){now=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}
   const nx=now==='dark'?'light':'dark';
   d.setAttribute('data-theme',nx);try{localStorage.setItem('fffth',nx)}catch(e){}};
})();

renderAll();
</script>

</body></html>
